outline:()=>`<div class="pagehead"><div><h1>改编大纲</h1><div class="sub">保留、改编、合并、删除决策均可追溯到原文证据</div></div><div class="actions"><button onclick="openImportModal()">导入原文</button><button onclick="openAdaptationSettings()">改编参数</button><button class="primary" onclick="generateOutline()">生成大纲草稿</button></div></div>${state.sourceImport?.originalRelease?`<div class="card"><div class="cardtitle">已接受的原创分集映射 <span class="tag">ManuscriptRelease ${escapeHtml(state.sourceImport.originalRelease.manuscriptReleaseId)}</span></div><p class="hint">映射由 AI 提议并经作者逐集接受；大纲候选必须以这些来源章节和改编目标为输入，不能静默变更集数或章节范围。</p>${(state.adaptationSettings?.mappingPlan||[]).map((line,i)=>`<div class="queueitem"><span class="tag">E${String(i+1).padStart(2,'0')}</span><span>${escapeHtml(line)}</span></div>`).join('')}</div>`:''}<div class="card"><div class="cardtitle">故事核心 <span class="hint">模型生成后可编辑；确认版本才作为剧本输入</span></div><textarea rows="4" style="width:100%" onchange="state.storyCore=this.value;markStageEdited('outline','修改故事核心');persistPrototype()">${state.storyCore||'林澄在南汀岛旧气象站封存前发现旧风暴记录缺失十一分钟。她与值班员陆闻川追查纸面记录、录音和潮痕之间的矛盾。'}</textarea></div><div class="card"><div class="cardtitle">剧情取舍 <button style="margin-left:auto" onclick="doAction('新增剧情节点')">＋ 新增节点</button></div><div class="cols4">${Object.entries(outlineItems).map(([key,list])=>`<div class="colbox"><h4>${{keep:'保留',adapt:'改编',merge:'合并',remove:'删除'}[key]} <button class="icon" onclick="doAction('增加${{keep:'保留',adapt:'改编',merge:'合并',remove:'删除'}[key]}条目')">＋</button></h4>${list.map((x,i)=>{const ev=state.outlineEvidence?.[key+':'+x];return `<div class="storycard"><b>${i+1}.</b> ${escapeHtml(x)}<small class="hint"> · ${escapeHtml(ev?.sourceRef||'来源待补充')} · ${escapeHtml(ev?.reason||'理由待补充')}</small><button onclick="editOutlineItem('${key}',${i})">编辑依据</button></div>`}).join('')}</div>`).join('')}</div></div><div class="card"><div class="cardtitle">大纲检查</div><p class="textblock">检查主线因果、分集目标、冲突升级、人物弧线、节尾悬念和原文依据。未通过项应定位到节点并可编辑或豁免。</p><button onclick="runOutlineChecks()">运行检查</button><button onclick="openStageControl('outline')">阶段验收</button><p class="hint">检查结果：${state.outlineChecks?.version===workflowState.outline.version?(state.outlineChecks.passed?'通过':'有 '+state.outlineChecks.issues.length+' 项未通过'):'尚未运行 / 输入已变化'}</p>${state.outlineChecks?.issues?.map(x=>'<div class="setting"><span class="tag warn">待处理</span><span>'+escapeHtml(x)+'</span></div>').join('')||''}</div>`,
characters:()=>`<div class="pagehead"><div><h1>角色圣经</h1><div class="sub">身份关系、行为边界、服装阶段、声线与视觉锚点</div></div><div class="actions"><button onclick="doAction('已导入角色资料')">导入角色</button><button onclick="openStageControl('characters')">阶段控制</button><button class="primary" onclick="queueMissingRoleAnchors()">生成缺失锚点</button></div></div><div class="subtabs"><button class="${state.characterTab==='cast'?'active':''}" onclick="state.characterTab='cast';render()">角色卡</button><button class="${state.characterTab==='relations'?'active':''}" onclick="state.characterTab='relations';render()">人物关系</button><button class="${state.characterTab==='voice'?'active':''}" onclick="state.characterTab='voice';render()">声音与约束</button></div>${state.characterTab==='cast'?`<div class="person-grid">${characterNames.map((n,i)=>`<article class="person"><div class="portrait"></div><div><h4>${n} <span class="tag">${i<2?'主要角色':'配角'}</span></h4><p>${escapeHtml(state.characterCards[n]?.appearance||'身份、动机、行为边界、服装阶段与原文证据待校对。')}</p><p>锚点状态：${escapeHtml(state.characterCards[n]?.anchorStatus||'待确认')}</p><button onclick="editCharacter('${n}')">查看与编辑</button><button onclick="queueCharacterAnchor('${n}')">生成视图</button></div></article>`).join('')}</div>`:state.characterTab==='relations'?`<div class="card"><div class="cardtitle">人物关系 <button style="margin-left:auto" onclick="doAction('新增关系边')">＋ 添加关系</button></div>${projectRelations.map(r=>`<div class="storycard">${r.a} — <span class="tag">${r.type}</span> — ${r.b}<p>${r.evidence||'关系依据待补充'}</p></div>`).join('')}<p class="textblock">关系变化需注明发生集数与剧情依据；模型检查发现冲突时，提供原文位置和修订建议。</p></div>`:`<div class="card"><div class="cardtitle">声线与行为边界</div><table class="table"><thead><tr><th>角色</th><th>音色</th><th>表达节奏</th><th>行为禁区</th><th>操作</th></tr></thead><tbody>${characterNames.slice(0,4).map(n=>`<tr><td>${n}</td><td>${escapeHtml(state.characterCards[n]?.voice||'待配置')}</td><td>${escapeHtml(state.characterCards[n]?.voicePace||'待确认')}</td><td>${escapeHtml(state.characterCards[n]?.behavior||'未填写')}</td><td><button onclick="editCharacter('${n}')">编辑约束 / 声线</button><button onclick="doAction('播放声音预览')">试听</button></td></tr>`).join('')}</tbody></table></div>`}`, 
art:()=>`<div class="pagehead"><div><h1>美术圣经</h1><div class="sub">风格、场景空间、灯光、视角和道具状态；供分镜引用</div></div><div class="actions"><button onclick="doAction('新建场景')">＋ 场景</button><button onclick="doAction('新建道具')">＋ 道具</button><button onclick="openStageControl('art')">阶段控制</button><button class="primary" onclick="queueMissingSceneViews()">生成缺失视图</button></div></div><div class="subtabs"><button class="${state.artTab==='scenes'?'active':''}" onclick="state.artTab='scenes';render()">场景</button><button class="${state.artTab==='props'?'active':''}" onclick="state.artTab='props';render()">道具</button><button class="${state.artTab==='style'?'active':''}" onclick="state.artTab='style';render()">画风基线</button></div>${state.artTab==='scenes'?`<div class="workspace-grid">${projectScenes.map((n,i)=>`<div class="card"><div class="cardtitle">${escapeHtml(n)}<span class="tag ${state.sceneCards[n]?.anchorStatus==='已确认'?'ok':'warn'}">${escapeHtml(state.sceneCards[n]?.anchorStatus||'视图待确认')}</span></div><div class="shotimg" style="height:130px"></div><div class="filmstrip"><div class="film">正面</div><div class="film">东侧</div><div class="film">西侧</div><div class="film">俯视</div></div><p class="textblock">${escapeHtml(state.sceneCards[n]?.space||'空间方位、固定陈设、时间与灯光设定待填写。')} · ${escapeHtml(state.sceneCards[n]?.light||'灯光待设置')}</p><button onclick="editScene('${n}')">详情 / 编辑</button><button onclick="queueSceneViews('${n}')">生成视图</button></div>`).join('')}</div>`:state.artTab==='props'?`<div class="card"><table class="table"><thead><tr><th>道具</th><th>外观 / 状态</th><th>引用镜头</th><th>版本</th><th></th></tr></thead><tbody>${projectProps.map(n=>`<tr><td>${n}</td><td>${escapeHtml(state.propCards[n]?.appearance||'材质、颜色、持有者与剧情状态待确认')}<small style="display:block;color:var(--muted)">${escapeHtml(state.propCards[n]?.statusRules||'状态规则待补')}</small></td><td>分镜引用后显示</td><td>v${state.propCards[n]?.version||1} · ${state.propCards[n]?'已编辑':'草稿'}</td><td><button onclick="editProp('${n}')">编辑</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="card"><div class="cardtitle">项目画风基线 <span class="tag ${state.styleBibleConfirmed?'ok':'warn'}">${state.styleBibleConfirmed?'已确认':'待确认'}</span></div><label>风格描述</label><textarea rows="5" style="width:100%" onchange="state.styleBible=this.value;state.styleBibleConfirmed=false;markStageEdited('art','修改画风基线');persistPrototype()">${state.styleBible||'写实电影感；暖色室内灯光；自然肤色；高光克制；构图统一。'}</textarea><div class="rightsection"><h4>参考样片</h4><button onclick="openArtStyleReferences()">＋ 添加样片</button><button onclick="queueArtStyleSample()">生成小样</button><button onclick="confirmStyleBible()">确认画风基线</button><p class="hint">先审阅少量小样，再选择应用到后续资产。</p></div></div>`}`, 
script:()=>`<div class="pagehead"><div><h1>分集剧本</h1><div class="sub">场次、节拍、动作、对白、情绪与时长预算</div></div><div class="actions"><button onclick="exportCurrentScript()">导出 Markdown</button><button class="primary" onclick="generateScript()">生成 / 重写</button></div></div><div class="subtabs"><button class="${state.scriptTab==='episodes'?'active':''}" onclick="state.scriptTab='episodes';render()">分集剧本</button><button class="${state.scriptTab==='lines'?'active':''}" onclick="state.scriptTab='lines';render()">台词本</button><button class="${state.scriptTab==='coverage'?'active':''}" onclick="state.scriptTab='coverage';render()">节奏与覆盖</button></div>${state.scriptTab==='episodes'?`<div class="card"><div class="cardtitle">第 ${state.episode} 集　${escapeHtml(state.episodeScripts[state.episode]?.title||'剧本待生成')} <span class="tag warn">待确认版本</span><button style="margin-left:auto" onclick="openStageControl('script')">阶段验收</button></div>${episodeScriptScenes().length?episodeScriptScenes().map((sc,i)=>`<div class="storycard"><b>场 ${String(i+1).padStart(2,'0')} · <input value="${escapeHtml(sc.location)}" onchange="updateEpisodeScene(${i},'location',this.value)"></b><p>人物：<input value="${escapeHtml(sc.characters)}" onchange="updateEpisodeScene(${i},'characters',this.value)"> · 节拍 <input type="number" value="${sc.beatStart}" onchange="updateEpisodeScene(${i},'beatStart',this.value)" style="width:55px">–<input type="number" value="${sc.beatEnd}" onchange="updateEpisodeScene(${i},'beatEnd',this.value)" style="width:55px"></p><textarea rows="3" style="width:100%" onchange="updateEpisodeScene(${i},'action',this.value)" placeholder="目标、冲突动作、关系变化与场景节奏">${escapeHtml(sc.action)}</textarea><small>目标时长：<input type="number" min="1" value="${sc.durationSeconds}" onchange="updateEpisodeScene(${i},'durationSeconds',this.value)" style="width:65px"> 秒 · 修改后剧本版本递增、分镜及以后阶段过期</small></div>`).join(''):'<div class="empty"><b>本集还没有剧本场次</b><p>先生成剧本候选并通过审阅；接受后，场次、节拍与对白才进入编辑区。当前原型不会自动生成真实 AI 正文。</p><button class="primary" onclick="generateScript()">生成剧本候选</button></div>'}<button onclick="addEpisodeScene()">＋ 新增场次</button></div>`:state.scriptTab==='lines'?`<div class="card"><div class="cardtitle">对白与动作行 <button style="margin-left:auto" onclick="openDialogueMapping(-1)">＋ 新增对白</button></div><table class="table"><thead><tr><th>#</th><th>角色</th><th>台词 / 动作</th><th>情绪 / 表演</th><th>时长</th><th></th></tr></thead><tbody>${episodeDialogueCues().length?episodeDialogueCues().map((cue,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(cue.speaker||'待指定')}</td><td>${escapeHtml(cue.text)}</td><td>${escapeHtml(cue.emotion||'待设置')}</td><td>${cue.duration||'—'}s</td><td><button onclick="openDialogueMapping(${i})">编辑映射</button></td></tr>`).join(''):'<tr><td colspan="6" class="hint">尚无对白；剧本候选接受后生成并逐条映射。</td></tr>'}</tbody></table><button onclick="exportDialogueCsv()">导出台词音频清单</button></div>`:`<div class="card"><div class="cardtitle">时长与节拍覆盖</div><div class="stats"><div class="stat"><b>${episodeScriptScenes().reduce((n,x)=>n+Number(x.durationSeconds||0),0)}s</b><small>目标 ${Number(state.adaptationSettings?.minMinutes||2)*60}–${Number(state.adaptationSettings?.maxMinutes||5)*60}s</small></div><div class="stat"><b>${episodeScriptScenes().length}</b><small>场次</small></div><div class="stat"><b>${episodeScriptScenes().reduce((n,x)=>Math.max(n,Number(x.beatEnd||0)),0)}</b><small>节拍</small></div><div class="stat"><b>${Math.max(0,episodeScriptScenes().reduce((n,x)=>Math.max(n,Number(x.beatEnd||0)),0)-shotRecords.length)}</b><small>节拍待镜头覆盖（估算）</small></div></div><p class="textblock">检查每集的目标、冲突升级、转折、结尾钩子；时长按对白语速、动作和停顿估算。</p><button onclick="openCoverageScan()">扫描覆盖</button><button onclick="openStageControl('script')">阶段验收</button></div>`}`,
storyboard:()=>`<div class="pagehead"><div><h1>分镜 · E01-${String(state.episode).padStart(2,'0')}</h1><div class="sub">逐镜分镜与关键帧分开验收；视频只使用已确认输入。逐镜控制、关键帧、视频、配音、审查与投产</div></div><div class="actions"><button onclick="openStageControl('shotDesign')">分镜验收</button><button onclick="openCoverageScan()">检查覆盖</button><button onclick="openBatchSettings()">生成关键帧</button><button onclick="openStageControl('keyframes')">关键帧验收</button><button class="primary" onclick="queueVideo()">生成本段视频</button></div></div><div class="card" style="padding:9px 11px"><div class="rightrow" style="margin:0"><span class="toolnote">模型</span><span class="tag">${state.mode}</span><span class="toolnote">画幅</span><button onclick="setAspectRatio('16:9')">16:9</button><button onclick="setAspectRatio('9:16')">9:16</button><span class="spacer"></span><span class="tag warn">${shotRecords.length} 镜 · ${shotRecords.filter(x=>x.status==='已确认').length} 镜已确认</span></div></div><div class="subtabs"><button class="${state.storyTab==='shots'?'active':''}" onclick="state.storyTab='shots';render()">逐镜编辑</button><button class="${state.storyTab==='batches'?'active':''}" onclick="state.storyTab='batches';render()">关键帧 / 视频任务</button><button class="${state.storyTab==='audio'?'active':''}" onclick="state.storyTab='audio';render()">对白与音频</button><button class="${state.storyTab==='quality'?'active':''}" onclick="state.storyTab='quality';render()">质量检查</button><button class="${state.storyTab==='final'?'active':''}" onclick="state.storyTab='final';render()">成片时间线</button><button class="${state.storyTab==='export'?'active':''}" onclick="state.storyTab='export';render()">导出投产</button></div>${state.storyTab==='shots'?`<div class="rightrow"><span>镜头 ${shotRecords.length} 个 · 提示词和参数逐镜保存</span><span class="spacer"></span><button onclick="shotCommand(Math.max(0,shotRecords.length-1),'add')">＋ 新增镜头</button></div><div id="shots"></div>`:state.storyTab==='batches'?`<div class="card"><div class="cardtitle">生成队列与候选</div>${tasks.map(t=>`<div class="queueitem"><span class="tag ${t.status==='待验收'?'warn':'blue'}">${t.status}</span><div>${t.type} · ${t.target}<small style="display:block;color:var(--muted)">${t.detail}</small></div><button onclick="openQueue()">管理</button></div>`).join('')||'<p class="textblock">暂无线索。提交关键帧或视频任务后显示状态。</p>'}<button onclick="openBatchSettings()">批量设置 / 生成</button></div>`:state.storyTab==='audio'?`<div class="card"><div class="cardtitle">对白映射与语音任务</div><table class="table"><thead><tr><th>对白</th><th>说话人</th><th>镜头 / 时间码</th><th>情绪</th><th></th></tr></thead><tbody>${episodeDialogueCues().length?episodeDialogueCues().map((cue,i)=>`<tr><td>${escapeHtml(cue.text)}</td><td>${escapeHtml(cue.speaker||'待指定')}</td><td>${escapeHtml(cue.shotId||'待映射')} · ${escapeHtml(cue.start||'—')}–${escapeHtml(cue.end||'—')}</td><td>${escapeHtml(cue.emotion||'待设置')}</td><td><button onclick="openDialogueMapping(${i})">编辑映射</button></td></tr>`).join(''):'<tr><td colspan="5" class="hint">尚无对白；剧本候选接受后从逐场内容生成对白 cue。</td></tr>'}</tbody></table><button class="primary" onclick="queueMappedDialogue()">生成已映射对白</button><button onclick="openStageControl('post')">后期阶段控制</button><p class="hint">TTS 任务与视频分开排队；生成后逐句试听并验收。</p></div>`:state.storyTab==='quality'?`<div class="card"><div class="cardtitle">质量门禁与可定位问题</div><table class="table"><thead><tr><th>规则</th><th>结果</th><th>影响对象</th><th>操作</th></tr></thead><tbody><tr><td>节拍 / 对白覆盖</td><td>4 项待检查</td><td>Shot mapping</td><td><button onclick="openCoverageScan()">查看并补镜</button></td></tr><tr><td>轴线 / 视线连续性</td><td>1 项提醒</td><td>Shot 4</td><td><button onclick="doAction('已建议切换机位')">应用建议</button></td></tr><tr><td>镜头总时长</td><td>待重算</td><td>当前段</td><td><button onclick="doAction('已按节拍重算镜头时长')">重算</button></td></tr></tbody></table><button onclick="doAction('已重新运行全部质量检查')">重新运行检查</button><button onclick="openStageControl('shotDesign')">分镜验收</button></div>`:state.storyTab==='final'?`<div class="card"><div class="cardtitle">整集时间线 <span class="tag warn">演示媒体状态 · 尚未生成真实视频</span></div><div class="preview" style="height:330px"><div class="play" onclick="doAction('播放整集预览')">▶</div><div class="previewlabel">素材需由视频服务生成并验收后才能播放</div></div><div class="rightsection"><h4>字幕与时间码</h4>${episodeCaptionCues().map((c,i)=>`<div class="setting"><span>${escapeHtml(c.start||'--:--')}–${escapeHtml(c.end||'--:--')} · ${escapeHtml(c.speaker||'')}</span><span>${escapeHtml(c.text)}</span><button onclick="openCaptionEdit(${i})">编辑</button></div>`).join('')||'<p class="hint">尚无字幕 cue；添加台词后逐条校准时间码。</p>'}<button onclick="openCaptionEdit(-1)">＋ 添加字幕 cue</button></div><div class="rightrow"><button onclick="openCaptionEdit()">字幕校对</button><button onclick="doAction('音轨设置已打开')">音轨与字幕设置</button><button class="primary" onclick="queueEpisodeAssembly()">提交合成任务</button></div></div>`:`<div class="card"><div class="cardtitle">投产包</div><p class="textblock">导出结构化分镜、提示词、引用素材 manifest、检查报告与版本关系。不包含 API Key。</p><label>目标模型</label><select id="exportModel"><option>H3</option><option>Seedance</option><option>Wan</option><option>通用 JSON</option></select><label>画幅</label><select id="exportRatio"><option>16:9</option><option>9:16</option></select><button class="primary" onclick="doAction('已导出 storyboard.json 与分段投产包')">导出投产包</button></div>`}`,
canvas:()=>`<div class="pagehead"><div><h1>AI 流程画布</h1><div class="sub">AI 按小说、已确认阶段和交付目标预先规划节点与依赖；人工可以审阅、修改或直接运行，不需要手工搭图。当前运行仅为演示队列，不调用真实模型 API</div></div><div class="actions"><button onclick="openStageControl('shotDesign')">分镜验收</button><button onclick="openGraphPlan()">AI 生成 / 更新流程</button><button class="primary" onclick="reviewAndRunGraph()">审阅计划并启动</button></div></div><div class="canvas-toolbar"><button onclick="openGraphAdd()">＋ 添加节点</button><button onclick="canvasZoom(-.1)">－</button><span id="zoomLabel">${Math.round((state.canvasZoom||.8)*100)}%</span><button onclick="canvasZoom(.1)">＋</button><button onclick="canvasFit()">看全部</button><button onclick="graphUndo()">撤销</button><button onclick="graphRedo()">重做</button><span class="graph-toolbar-note">AI 规划状态：${state.graphPlanStatus} · v${state.graphPlanVersion}。手动拖拽 / 连线是可选的高级编辑。</span><span class="spacer"></span><button onclick="openQueue()">任务队列</button></div><div class="canvas-shell" id="canvasShell"><div class="graph-world" id="graphWorld"><svg id="graphSvg" width="1700" height="850"></svg>${graphNodes.map(n=>`<article class="graph-node" id="node-${n.id}" style="left:${n.x}px;top:${n.y}px" ondblclick="openGraphNode('${n.id}')"><span class="graph-port input" title="连接输入" onpointerdown="graphPort(event,'${n.id}','in')"></span><span class="graph-port output" title="连接输出" onpointerdown="graphPort(event,'${n.id}','out')"></span><div class="graph-node-head" onpointerdown="startGraphDrag(event,'${n.id}')"><span class="tag ${n.status==='已确认'?'ok':n.status==='待验收'?'warn':'blue'}">${n.status}</span><b>${n.title}</b><span class="spacer"></span><small>v${n.version}</small></div><div class="graph-node-body"><small>${{input:'输入',text:'文本 / 逻辑',image:'图片模型',video:'视频模型',audio:'语音 / 字幕',compose:'本地处理'}[n.type]} · ${n.stage}</small><p class="textblock">${n.output}</p><div class="graph-node-actions"><button onclick="openGraphNode('${n.id}')">参数 / 预览</button><button onclick="runGraphNode('${n.id}',false)">运行节点</button><button onclick="runGraphNode('${n.id}',true)">重跑下游</button></div></div></article>`).join('')}</div><div class="graph-minimap">小地图 · ${graphNodes.length} 节点　${graphEdges.length} 条依赖</div></div>`,
delivery:()=>{const post=workflowState.post,del=workflowState.delivery,rev=deliveryRevisions.filter(r=>r.episodeId===state.episode);return `<div class="pagehead"><div><h1>第 ${state.episode} 集 · 审片与交付</h1><div class="sub">整集质量门、交付候选、版本留档与交付后修订</div></div><div class="actions"><button onclick="openStageControl('post')">声音 / 合成门禁 · ${post.status}</button><button class="primary" onclick="openStageControl('delivery')">交付阶段控制 · ${del.status}</button></div></div><div class="stats"><div class="stat"><b>${post.status}</b><small>后期合成门禁 ${post.stale?'· 过期':''}</small></div><div class="stat"><b>${del.status}</b><small>本集交付状态 ${del.stale?'· 过期':''}</small></div><div class="stat"><b>${tasks.filter(t=>t.episodeId===state.episode&&t.stageId==='delivery'&&['待验收','已接受'].includes(t.status)).length}</b><small>交付候选 / 已接受</small></div><div class="stat"><b>${rev.filter(r=>r.status!=='已关闭').length}</b><small>未关闭修订</small></div></div><div class="workspace-grid"><div class="card"><div class="cardtitle">母版预览与审片</div><div class="preview" style="height:250px"><div class="play" onclick="doAction('播放当前段成片')">▶</div><div class="previewlabel">当前集成片 · 预览版本绑定时间线与合成快照</div></div><p class="hint">审片意见必须落到集、时间码、镜头或音轨；接受交付后生成不可覆盖的 Delivery ID。</p><button onclick="openDeliveryRevision()">＋ 记录审片意见 / 创建修订</button></div><div class="card"><div class="cardtitle">导出预检</div><div class="setting"><span>后期阶段</span><span class="tag ${post.status==='已确认'&&!post.stale?'ok':'warn'}">${post.status}${post.stale?' · 过期':''}</span></div><label>画幅</label><select id="deliveryAspect"><option>16:9</option><option>9:16</option><option>1:1</option></select><label>视频编码</label><select id="deliveryCodec"><option>H.264 · MP4</option><option>H.265 · MP4</option><option>ProRes · MOV</option></select><label>字幕交付</label><select id="deliverySubtitle"><option>MP4 + SRT + VTT</option><option>烧录字幕 MP4 + SRT</option><option>无字幕 MP4</option></select><label><input id="deliveryRights" type="checkbox"> 已核对全部素材的授权范围与发行限制</label><p class="hint">导出前必须完成后期门禁；授权状态未确认时只能生成内部审片包。</p><button onclick="startDeliveryStage()">开始 / 继续交付阶段</button><button class="primary" onclick="submitDeliveryExport()">运行导出预检并加入队列</button></div></div><div class="card"><div class="cardtitle">本集交付版本</div><table class="table"><thead><tr><th>Delivery ID</th><th>状态</th><th>输出</th><th>时间</th><th>操作</th></tr></thead><tbody>${tasks.filter(t=>t.episodeId===state.episode&&t.stageId==='delivery').map(t=>`<tr><td>${t.deliveryId||'候选 · '+t.id}</td><td>${t.status}</td><td>${t.target}</td><td>${t.review?.at||t.createdAt||'—'}</td><td>${t.status==='待验收'?`<button onclick="reviewCandidate('${t.id}')">审阅候选</button>`:t.status==='已接受'?'<span class="tag ok">已锁定候选</span>':'<button onclick="openQueue()">查看任务</button>'}</td></tr>`).join('')||'<tr><td colspan="5">暂无交付候选</td></tr>'}</tbody></table></div><div class="card"><div class="cardtitle">审片意见与修订回路</div>${rev.map(r=>`<div class="queueitem"><span class="tag ${r.status==='已关闭'?'ok':'warn'}">${r.status}</span><div style="flex:1"><b>${r.severity} · ${r.timecode} · ${r.targetStage}</b><small style="display:block;color:var(--muted)">${r.note} · 原交付 ${r.deliveryId||'—'}</small></div>${r.status!=='已关闭'?`<button onclick="openRevisionStage('${r.id}')">去返工</button><button onclick="closeDeliveryRevision('${r.id}')">关闭修订</button>`:''}</div>`).join('')||'<p class="textblock">暂无审片意见。交付后发现问题时，在此创建修订，指定时间码与返工阶段。</p>'}</div>`},
assets:()=>`<div class="pagehead"><div><h1>素材库</h1><div class="sub">角色、场景、道具、关键帧与交付件</div></div><div class="actions"><button onclick="choose()">导入文件</button><button onclick="doAction('已创建素材文件夹')">新建文件夹</button></div></div><div class="card"><div class="cardtitle">素材分类</div><div class="filmstrip">${materialFolders.map(n=>`<button class="film" onclick="state.assetFolder='${n}';render()">${n}</button>`).join('')}</div><p class="hint">当前分类：${escapeHtml(state.assetFolder||'全部素材')} · 点击素材行可查看引用与授权元数据。</p></div><div class="card"><table class="table"><thead><tr><th>素材</th><th>类型 / 分类</th><th>授权状态</th><th>来源 / 备注</th><th>登记分集</th><th>操作</th></tr></thead><tbody>${(state.importedAssets||[]).filter(a=>!state.assetFolder||state.assetFolder==='全部素材'||a.folder===state.assetFolder).map(a=>`<tr><td>${escapeHtml(a.name)}<small style="display:block;color:var(--muted)">${escapeHtml(a.filename)}</small></td><td>${escapeHtml(a.mime)} · ${escapeHtml(a.folder)}</td><td><span class="tag ${a.rights.includes('待核实')?'warn':'ok'}">${escapeHtml(a.rights)}</span></td><td>${escapeHtml(a.note||'—')}</td><td>${a.episodeId?'第 '+a.episodeId+' 集':'项目'}</td><td><button onclick="editAssetRecord('${a.id}')">编辑来源</button></td></tr>`).join('')||'<tr><td colspan="6">当前分类暂无素材。导入后在此查看授权和引用线索。</td></tr>'}</tbody></table></div>`,
history:()=>`<div class="pagehead"><div><h1>变更记录</h1><div class="sub">阶段、字段、模型任务、审阅决定和恢复点</div></div><div class="actions"><button onclick="openRevisionPicker()">恢复点</button></div></div><div class="card"><table class="table"><thead><tr><th>时间</th><th>范围</th><th>变更</th><th>版本</th><th>操作</th></tr></thead><tbody>${(changeLog.length?changeLog:[{time:'示例',label:'尚无本地变更'}]).map((x,i)=>`<tr><td>${x.time}</td><td>${x.scope==='project'?'项目级':x.episodeId?'第 '+x.episodeId+' 集':'项目'}</td><td>${x.label}</td><td>v${Math.max(1,changeLog.length-i)}</td><td><button onclick="openRevisionPicker()">查看 / 恢复</button></td></tr>`).join('')}</tbody></table></div>`
};
function navigate(page){state.page=page;render()}
function setEpisode(n){state.episode=Math.max(1,Math.min(episodes.length,Number(n)||1));state.shot=1;render()}
function buildToolbar(){const bar=document.querySelector('#toolbar');if(state.page==='storyboard'){bar.innerHTML=`<button class="tabbtn ${state.mode==='H3'?'active':''}" onclick="setMode('H3',this)">H3</button><button class="tabbtn ${state.mode==='Seedance'?'active':''}" onclick="setMode('Seedance',this)">Seedance</button><button class="tabbtn ${state.mode==='Wan'?'active':''}" onclick="setMode('Wan',this)">Wan</button><button class="tabbtn ${state.mode.includes('Ref2VA')?'active':''}" onclick="setMode('Ref2VA · 全参考',this)">Ref2VA · 全参考</button><div class="grow"></div><span class="toolnote">文本</span><select aria-label="文本服务档案" onchange="setProvider('text',this.value)">${toolbarServiceOptions('text')}</select><span class="toolnote">图片</span><select aria-label="图片服务档案" onchange="setProvider('image',this.value)">${toolbarServiceOptions('image')}</select><span class="toolnote">视频</span><select aria-label="视频服务档案" onchange="setProvider('video',this.value)">${toolbarServiceOptions('video')}</select>`}else{bar.innerHTML=`<button class="tabbtn active">${navNames[state.page]}</button><span class="toolnote">当前分集</span><select aria-label="当前分集" onchange="setEpisode(Number(this.value))">${episodes.map(e=>`<option value="${e.id}" ${e.id===state.episode?'selected':''}>第 ${e.id} 集</option>`).join('')}</select><div class="grow"></div><span class="toolnote"><i class="dot"></i> 本地演示 · 自动保存</span><button onclick="openSettings('本剧')">⚙ 模型与服务</button>`}}
function buildList(){const el=document.querySelector('#listBody'),title=document.querySelector('#listTitle'),desc=document.querySelector('#listDescription'),ey=document.querySelector('#listEyebrow');ey.textContent=(navNames[state.page]||'工作台').toUpperCase()+' · '+(state.page==='storyboard'?'STORYBOARD':'PROJECT');if(state.page==='storyboard'){title.textContent='第 '+state.episode+' 集 · 镜头段落';desc.textContent=shotRecords.length+' 镜 · '+shotRecords.filter(x=>x.status==='已确认').length+' 镜已确认';el.innerHTML='<div class="minihead">分集 / 段落</div>'+episodes.map(x=>`<div class="listitem ${x.id===state.episode?'sel':''}" onclick="setEpisode(${x.id})"><span>E01-${String(x.id).padStart(2,'0')}</span><small>剧本 ${episodeWorkflowStates[x.id]?.script?.status||'未开始'} · 交付 ${episodeWorkflowStates[x.id]?.delivery?.status||'未开始'}</small></div>`).join('')}else{title.textContent=navNames[state.page]||'制作流程';desc.textContent=state.page==='overview'?'十阶段可控 · 版本有迹可循':state.page==='source'?'导入批次与章节结构':'选择项目对象';el.innerHTML=state.page==='art'?projectScenes.map(n=>`<div class="listitem" onclick="editScene('${n}')">${n}<small>场景</small></div>`).join(''):state.page==='characters'?characterNames.map(n=>`<div class="listitem" onclick="editCharacter('${n}')">${n}<small>角色</small></div>`).join(''):Object.entries(navNames).map(([p,n])=>`<div class="listitem ${p===state.page?'sel':''}" onclick="navigate('${p}')">${n}<small>›</small></div>`).join('')}}
function render(){document.querySelectorAll('.rail button[data-section]').forEach(x=>x.classList.toggle('active',x.dataset.section===state.page));buildToolbar();buildList();document.querySelector('#content').innerHTML=(pages[state.page]||pages.overview)();if(state.page==='storyboard'&&state.storyTab==='shots')drawShots();if(state.page==='canvas')initCanvas();document.querySelector('#rightPane').innerHTML=rightPanel();persistPrototype()}
function rightPanel(){if(state.page!=='storyboard')return `<div class="rightsection"><h4>模型与服务路由</h4><div class="setting"><span>文本</span><span>${state.providers?.text||'deepseek-v4-pro'}</span></div><div class="setting"><span>图片</span><span>${state.providers?.image||'ComfyUI · Qwen-Image'}</span></div><div class="setting"><span>视频</span><span>${state.providers?.video||'ComfyUI · H3'}</span></div><button onclick="openSettings('项目默认')">配置服务</button></div><div class="rightsection"><h4>阶段门禁</h4><p class="textblock">${workflowStages.find(x=>x.id===state.page)?.gate||'从概览选择阶段，查看输入、控制项与验收条件。'}</p></div>`;return `<div class="rightsection"><div class="preview"><div class="play" onclick="doAction('播放当前段成片')">▶</div><div class="previewlabel">演示预览 · E01-${String(state.episode).padStart(2,'0')} · ${state.aspectRatio||'16:9'}</div></div><div class="filmstrip">${shotRecords.map((x,i)=>`<button class="film" onclick="state.shot=${i+1};render()">#${i+1} · ${x.duration}s</button>`).join('')}</div><div class="rightrow"><button onclick="openRevisionPicker()">历史版本</button><span class="spacer"></span><button class="primary" onclick="queueVideo()">生成 / 重试本段视频</button></div></div><div class="rightsection"><h4>生成设置 <span class="tag">${state.mode} · ${state.aspectRatio||'16:9'}</span></h4><label>视频服务</label><select onchange="setProvider('video',this.value)"><option>${state.providers?.video||'ComfyUI · H3'}</option><option>Seedance API</option><option>Wan API</option><option>自定义 API</option></select><label>分辨率</label><select onchange="state.resolution=this.value;persistPrototype()"><option>720p</option><option>1080p</option></select><label><input type="checkbox" checked onchange="state.continueFromPrevious=this.checked;persistPrototype()"> 衔接上一段末帧</label></div><div class="rightsection"><h4>引用素材 ${shotRecords[state.shot-1]?.assetRefs?.length||0} / 10 <button class="icon" onclick="openAssetPicker(${Math.max(0,state.shot-1)})">＋</button></h4>${(shotRecords[state.shot-1]?.assetRefs||[]).map(x=>`<div class="assetbox">${x}<button class="icon" onclick="removeShotAsset(${Math.max(0,state.shot-1)},'${x}')">×</button></div>`).join('')||'<p class="hint">为当前镜头选择角色、场景、道具或历史帧。</p>'}</div><div class="rightsection"><h4>任务状态</h4><p class="textblock">${tasks.filter(x=>!['已取消','已归档'].includes(x.status)).map(x=>x.type+' · '+x.status).join('<br>')||'无运行中任务'}</p><button onclick="openQueue()">打开生成队列</button><p class="hint">任务操作均为原型模拟；未向 API 提交请求。</p></div>`}
function openGraphPlan(){showModal('AI 规划生成流程','<p>AI 将读取当前项目已确认版本、目标画幅和交付要求，自动安排生成节点、输入引用、阶段依赖、质量门禁与可并行分支。</p><label>规划范围</label><select id="planScope"><option>当前集 · 从剧本到交付</option><option>当前阶段 · 从分镜到关键帧</option><option>全项目 · 小说到整集母版</option><option>仅指定镜头 · 当前集全部镜头</option></select><label>生成策略</label><select id="planStrategy"><option>质量优先 · 逐镜确认关键帧后出视频</option><option>平衡 · 关键帧批量审核后生成视频</option><option>快速探索 · 并行生成候选，不直接进入交付</option></select><label>额外要求</label><textarea id="planRules" rows="3" style="width:100%" placeholder="例如：角色锚点固定，关键对白必须有反应镜头"></textarea><p class="hint">AI 先产出可编辑的流程草案；检查依赖、模型能力、资产引用与验收门后，由你决定是否启动。</p><p class="textblock">原型说明：这里会模拟规划状态；真实版本调用文本模型生成带类型检查的工作流 JSON。</p>','生成流程草案',()=>{state.graphPlanScope=document.querySelector('#planScope').value;state.graphPlanStrategy=document.querySelector('#planStrategy').value;state.graphPlanRules=document.querySelector('#planRules').value;state.graphPlanVersion=(state.graphPlanVersion||1)+1;state.graphPlanStatus='AI 已拟定 · 待审阅';graphNodes.forEach(n=>{n.planNote='AI规划 · '+state.graphPlanScope});recordChange('AI 生成流程草案 · v'+state.graphPlanVersion);render();toast('流程草案已准备好；请审阅后启动')})}
function graphRunBlockers(nodes){const blocked=[];for(const n of nodes){for(const id of stageAncestors(n.stage)){const upstream=workflowStages.find(x=>x.id===id),st=workflowState[id];if(!['已确认','已交付','已豁免'].includes(st.status)||st.stale){const item=upstream.name+' · '+st.status+(st.stale?'（上游版本已变更）':'');if(!blocked.includes(item))blocked.push(item)}}}return blocked}
function reviewAndRunGraph(){const allNodes=graphNodes.filter(n=>n.stage!=='source'),enabled=allNodes.filter(n=>!n.locked&&!['已确认','已接受'].includes(n.status)),reused=allNodes.filter(n=>['已确认','已接受'].includes(n.status)),blocked=graphPlanInitialBlockers(enabled);const body='<div class="rightrow"><span class="tag blue">AI 流程草案 v'+(state.graphPlanVersion||1)+'</span><span class="tag warn">'+(state.graphPlanStatus||'待审阅')+'</span></div><p class="textblock">范围：'+(state.graphPlanScope||'当前集 · 从剧本到交付')+'<br>策略：'+(state.graphPlanStrategy||'质量优先 · 逐镜确认关键帧后出视频')+'</p>'+ (blocked.length?'<div class="rightsection"><h4>正式运行阻塞项</h4><ul>'+blocked.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul><p class="hint">先完成上游门禁；如只做探索验证，可选择隔离模式，产物不能进入正式交付。</p></div>':'<p class="tag ok">外部上游门禁已通过；计划内依赖会在候选审阅/阶段门后继续</p>')+(reused.length?'<h4>复用已确认产物</h4>'+reused.map(n=>'<div class="queueitem"><span class="tag ok">复用</span> '+escapeHtml(n.title)+' · v'+n.version+'</div>').join(''):'')+'<h4>执行顺序与可审阅产物</h4>'+enabled.map((n,i)=>'<div class="queueitem"><label><input type="checkbox" data-node="'+n.id+'" checked> '+(i+1)+'. '+escapeHtml(n.title)+'</label><span class="tag">'+n.type+'</span><small>'+escapeHtml(n.output)+'</small></div>').join('')+'<div class="rightsection"><h4>人工控制点</h4><p class="textblock">剧本 → 节拍/时长验收 → 逐镜分镜 → 关键帧审阅 → 逐镜视频候选 → 配音/字幕 → 时间线与交付验收。</p><label><input id="graphExplore" type="checkbox"> 探索模式（使用未验收上游；结果隔离，仅供参考）</label></div>';showModal('AI流程计划审阅',body,'审阅并启动演示流程',()=>{const chosen=[...document.querySelectorAll('#modalBody input[data-node]:checked')].map(x=>x.dataset.node);if(!chosen.length)throw Error('至少选择一个执行节点');const selectedNodes=chosen.map(id=>graphNodes.find(n=>n.id===id)).filter(Boolean),blockers=graphPlanInitialBlockers(selectedNodes),explore=document.querySelector('#graphExplore').checked;if(blockers.length&&!explore)throw Error('上游门禁未通过：'+blockers.join('、')+'。完成门禁或显式勾选探索模式');state.graphPlanStatus=explore?'已审阅 · 隔离探索运行':'已审阅 · 演示运行中';recordChange((explore?'启动隔离探索':'批准正式流程草案')+' · '+chosen.length+' 个节点');runGraphSelection(chosen,explore);persistPrototype();render();toast(explore?'隔离探索任务已排队':'流程已按依赖顺序进入演示队列')})}
function graphPredecessorsReady(n){return graphEdges.filter(e=>e.to===n.id).every(e=>{const p=graphNodes.find(x=>x.id===e.from);return p&&(['已确认','已接受'].includes(p.status)||p.locked&&p.status==='已确认')})}
function graphNodeCanRun(n){return graphPredecessorsReady(n)&&graphRunBlockers([n]).length===0}
function graphPlanInitialBlockers(nodes){const plannedStages=new Set(nodes.map(n=>n.stage)),blocked=[];for(const n of nodes){for(const id of stageAncestors(n.stage)){const st=workflowState[id];if(!['已确认','已交付','已豁免'].includes(st.status)||st.stale){if(plannedStages.has(id))continue;const name=workflowStages.find(x=>x.id===id)?.name||id,item=name+' · '+st.status+(st.stale?'（上游版本已变更）':'');if(!blocked.includes(item))blocked.push(item)}}}return blocked}
function unlockGraphWaitingTasks(){let changed=false;for(const t of tasks.filter(x=>x.status==='等待门禁'&&x.graphNodeId)){const n=graphNodes.find(x=>x.id===t.graphNodeId);const selected=state.episode;if(t.episodeId)state.episode=t.episodeId;const can=n&&graphNodeCanRun(n);state.episode=selected;if(can){t.status='排队中';t.detail='上游候选已审阅，阶段门禁通过 · 等待 worker';n.status='排队中';changed=true}}if(changed){refreshQueueBadge();persistPrototype()}}
function runGraphSelection(selected,exploration=false){const pending=new Set(selected),ordered=[];while(pending.size){const ready=[...pending].filter(id=>!graphEdges.some(e=>e.to===id&&pending.has(e.from)));if(!ready.length)throw Error('选中节点存在循环依赖，无法执行');ready.forEach(id=>{pending.delete(id);ordered.push(id)})}for(const id of ordered){const n=graphNodes.find(x=>x.id===id);if(!n||n.locked)continue;const runnable=exploration||graphNodeCanRun(n);n.status=runnable?'排队中':'等待门禁';const jobId=addTask(graphJobType(n),n.title,'AI流程 v'+state.graphPlanVersion+' · 参数与输入快照已锁定'+(exploration?' · 隔离探索':runnable?' · 正式分支':' · 等待上游审阅'),n.stage,nodeServiceOverride(n));const job=tasks.find(x=>x.id===jobId);if(job){job.graphNodeId=id;job.exploration=exploration;if(!runnable&&!exploration)job.status='等待门禁'}}refreshQueueBadge()}
function initCanvas(){const world=document.querySelector('#graphWorld');if(!world)return;world.style.transform='scale('+(state.canvasZoom||.8)+')';const svg=document.querySelector('#graphSvg');svg.innerHTML=graphEdges.map(e=>{const a=graphNodes.find(n=>n.id===e.from),b=graphNodes.find(n=>n.id===e.to);if(!a||!b)return '';const x1=a.x+245,y1=a.y+82,x2=b.x,y2=b.y+82,m=(x1+x2)/2;return `<path class="graph-edge" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}"/>`}).join('');}
function canvasZoom(delta){state.canvasZoom=Math.max(.45,Math.min(1.25,(state.canvasZoom||.8)+delta));const z=document.querySelector('#zoomLabel');if(z)z.textContent=Math.round(state.canvasZoom*100)+'%';initCanvas();persistPrototype()}
function canvasFit(){state.canvasZoom=.68;canvasZoom(0)}
let graphDrag=null,graphPending=null,graphUndoStack=[],graphRedoStack=[];
function graphSnapshot(){graphUndoStack.push(JSON.stringify({nodes:graphNodes,edges:graphEdges}));if(graphUndoStack.length>30)graphUndoStack.shift();graphRedoStack=[]}
function graphUndo(){if(!graphUndoStack.length)return toast('没有可撤销的画布操作');graphRedoStack.push(JSON.stringify({nodes:graphNodes,edges:graphEdges}));const v=JSON.parse(graphUndoStack.pop());graphNodes.splice(0,graphNodes.length,...v.nodes);graphEdges.splice(0,graphEdges.length,...v.edges);recordChange('撤销画布操作');render()}
function graphRedo(){if(!graphRedoStack.length)return toast('没有可重做的画布操作');graphUndoStack.push(JSON.stringify({nodes:graphNodes,edges:graphEdges}));const v=JSON.parse(graphRedoStack.pop());graphNodes.splice(0,graphNodes.length,...v.nodes);graphEdges.splice(0,graphEdges.length,...v.edges);recordChange('重做画布操作');render()}
function startGraphDrag(ev,id){if(ev.target.closest('button')||ev.target.classList.contains('graph-port'))return;graphSnapshot();const n=graphNodes.find(x=>x.id===id);graphDrag={id,x:ev.clientX,y:ev.clientY,ox:n.x,oy:n.y};ev.preventDefault();document.onpointermove=e=>{if(!graphDrag)return;const nd=graphNodes.find(x=>x.id===graphDrag.id);nd.x=Math.max(0,graphDrag.ox+(e.clientX-graphDrag.x)/(state.canvasZoom||.8));nd.y=Math.max(0,graphDrag.oy+(e.clientY-graphDrag.y)/(state.canvasZoom||.8));const el=document.querySelector('#node-'+nd.id);if(el){el.style.left=nd.x+'px';el.style.top=nd.y+'px'}initCanvas()};document.onpointerup=()=>{if(graphDrag){recordChange('移动画布节点 · '+graphDrag.id);graphDrag=null}document.onpointermove=null;document.onpointerup=null}}
function graphPort(ev,id,side){ev.stopPropagation();ev.preventDefault();if(side==='out'){graphPending=id;document.querySelectorAll('.graph-node').forEach(x=>x.classList.remove('graph-pending'));document.querySelector('#node-'+id)?.classList.add('graph-pending');return}if(!graphPending)return;const from=graphPending,to=id;graphPending=null;document.querySelectorAll('.graph-node').forEach(x=>x.classList.remove('graph-pending'));if(from===to)return toast('不能把节点连接到自身');if(graphEdges.some(x=>x.from===from&&x.to===to))return toast('这条依赖已存在');if(graphReachable(to,from))return toast('该连接会形成循环依赖');graphSnapshot();graphEdges.push({from,to});recordChange('连线 · '+from+' → '+to);render();toast('节点依赖已连接')}
function graphReachable(from,to,seen=new Set()){if(from===to)return true;if(seen.has(from))return false;seen.add(from);return graphEdges.filter(e=>e.from===from).some(e=>graphReachable(e.to,to,seen))}
function graphDescendants(id,seen=new Set()){for(const e of graphEdges.filter(x=>x.from===id)){if(!seen.has(e.to)){seen.add(e.to);graphDescendants(e.to,seen)}}return [...seen]}
function invalidateGraphDescendants(id){graphDescendants(id).forEach(x=>{const n=graphNodes.find(z=>z.id===x);if(n&&!n.locked)n.status='上游已变更'})}
function graphServiceKind(n){return n.type==='image'?'image':n.type==='video'?'video':n.type==='text'?'text':null}
function graphServiceOptions(n){const kind=graphServiceKind(n);if(!kind)return '<option value="inherit">该节点不调用文本/图片/视频服务</option>';const profiles=state.serviceProfiles?.[kind]||[];return '<option value="inherit" '+(!n.serviceProfileId?'selected':'')+'>继承项目默认 · '+escapeHtml((state.services?.[kind]||{}).provider||kind)+'</option>'+profiles.map(p=>'<option value="'+escapeHtml(p.id)+'" '+(n.serviceProfileId===p.id?'selected':'')+'>'+escapeHtml(p.name)+' · '+escapeHtml(p.provider||p.model||'未命名配置')+'</option>').join('')}
function nodeServiceOverride(n){const kind=graphServiceKind(n);if(!kind)return null;const p=(state.serviceProfiles?.[kind]||[]).find(x=>x.id===n.serviceProfileId);return p?{...p,...(n.model?{model:n.model}:{})}:n.model?{model:n.model}:null}
function openGraphNode(id){const n=graphNodes.find(x=>x.id===id);if(!n)return;showModal(n.title+' · 节点设置','<div class="rightrow"><span class="tag">'+n.type+'</span><span class="tag">阶段 '+n.stage+'</span><span class="tag">v'+n.version+'</span><span class="tag">'+n.status+'</span></div><label>节点名称</label><input id="gnTitle" value="'+n.title+'" style="width:100%"><label>提示词 / 操作说明</label><textarea id="gnPrompt" rows="5" style="width:100%">'+n.prompt+'</textarea><label>服务档案（先在项目服务设置中创建）</label><select id="gnProfile">'+graphServiceOptions(n)+'</select><label>模型 ID 覆盖（可留空沿用档案设置）</label><input id="gnModel" value="'+escapeHtml(n.model||'')+'" style="width:100%"><p class="hint">选择档案会连同 endpoint、认证引用和协议 adapter 一起路由；不能只改 provider 名称伪装切换。</p><label>产物说明</label><input id="gnOutput" value="'+n.output+'" style="width:100%"><label><input id="gnLock" type="checkbox" '+(n.locked?'checked':'')+'> 锁定节点产物，重跑时跳过</label><div class="rightsection"><h4>入边 / 上游</h4><p class="textblock">'+graphEdges.filter(e=>e.to===id).map(e=>graphNodes.find(x=>x.id===e.from)?.title).join('、')+'</p><h4>出边 / 下游</h4><p class="textblock">'+graphEdges.filter(e=>e.from===id).map(e=>graphNodes.find(x=>x.id===e.to)?.title).join('、')+'</p></div><div class="rightrow"><button onclick="navigate(\''+n.page+'\')">打开阶段编辑器</button><button onclick="doAction(\'预览关键帧\')">预览产物</button></div>','保存节点',()=>{graphSnapshot();n.title=document.querySelector('#gnTitle').value.trim()||n.title;n.prompt=document.querySelector('#gnPrompt').value;n.output=document.querySelector('#gnOutput').value;n.serviceProfileId=document.querySelector('#gnProfile').value==='inherit'?'':document.querySelector('#gnProfile').value;n.model=document.querySelector('#gnModel').value.trim();n.locked=document.querySelector('#gnLock').checked;n.version++;n.status='已修改待复核';invalidateGraphDescendants(id);recordChange('编辑节点 · '+n.title);render();toast('节点已保存；下游节点已标记待复核')})}
function runGraphNode(id,downstream=false){const ids=downstream?[id,...graphDescendants(id)]:[id];const nodes=ids.map(x=>graphNodes.find(n=>n.id===x)).filter(n=>n&&!n.locked);if(!nodes.length)return toast('选中的节点均已锁定');const blocked=graphPlanInitialBlockers(nodes);showModal(downstream?'从此节点重跑下游':'运行节点','将执行：<b>'+nodes.map(n=>escapeHtml(n.title)).join(' → ')+'</b>'+(blocked.length?'<div class="rightsection"><h4>上游门禁阻塞</h4><ul>'+blocked.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul></div>':'<p>未验收依赖会先等待节点审阅和阶段门禁，不会提前执行。</p>')+'<p>本次任务使用每个节点当前版本的输入、配置和引用快照。已锁定节点跳过。</p><label><input id="nodeExplore" type="checkbox"> 隔离探索（允许未验收输入；不可进入交付）</label><p class="hint">演示原型不会调用模型。</p>','提交演示任务',()=>{const explore=document.querySelector('#nodeExplore').checked;if(blocked.length&&!explore)throw Error('上游门禁未通过；完成门禁或显式勾选隔离探索');runGraphSelection(nodes.map(n=>n.id),explore);recordChange((explore?'隔离探索':'正式分支')+'运行节点 · '+nodes.map(n=>n.id).join(', '));persistPrototype();render();toast(explore?'隔离探索任务已入队':'演示任务已进入队列')})}
function runAllGraph(){reviewAndRunGraph()}
function openGraphAdd(){showModal('添加画布节点','<label>节点类型</label><select id="newGraphType"><option value="text">文本 / LLM</option><option value="image">图片生成</option><option value="video">视频生成</option><option value="audio">音频 / TTS</option><option value="compose">本地媒体处理</option></select><label>节点名称</label><input id="newGraphName" value="新生成节点" style="width:100%"><p class="hint">添加后可拖动摆放，再把节点输入/输出端口连接到现有流程。连接仅表示数据依赖，不会自动跳过阶段验收门。</p>','添加节点',()=>{const id='node-'+Date.now(),type=document.querySelector('#newGraphType').value,title=document.querySelector('#newGraphName').value.trim()||'新节点';graphSnapshot();graphNodes.push({id,title,type,stage:state.page==='canvas'?'custom':state.page,page:state.page,x:60+Math.random()*500|0,y:600,status:'未运行',version:1,output:'待配置产物',prompt:'输入节点用途、约束和输出格式',locked:false});recordChange('添加画布节点 · '+title);render()})}
function removeShotAsset(index,id){shotRecords[index].assetRefs=(shotRecords[index].assetRefs||[]).filter(x=>x!==id);recordChange('移除镜头引用 · '+id);render()}

function markShotDownstreamStale(){for(const map of [state.episodeKeyframeApprovals?.[state.episode]||{},state.episodeVideoApprovals?.[state.episode]||{}])for(const value of Object.values(map))value.stale=true;const sb=workflowState.shotDesign;if(sb&&sb.status==='已确认'){sb.status='待复核';sb.stale=true}const kf=workflowState.keyframes;if(kf){kf.stale=true;if(['已确认','已交付','已豁免','待验收'].includes(kf.status))kf.status='待复核'}for(const id of ['video','post','delivery']){const st=workflowState[id];if(st){st.stale=true;if(['已确认','已交付','已豁免','待验收'].includes(st.status))st.status='待复核'}}for(const id of ['frames','video','audio','assembly']){const n=graphNodes.find(x=>x.id===id);if(n&&!n.locked)n.status='上游已变更'}}
function updateShot(index,key,value){const sh=shotRecords[index];if(!sh)return;const changed=sh[key]!==value;sh[key]=key==='duration'?Math.max(.5,Number(value)||.5):value;if(changed&&sh.status==='已确认'){sh.status='已修改待复核';markShotDownstreamStale();recordChange('修改已确认镜头 · '+sh.id+'；关键帧/视频下游标记过期')}persistPrototype()}
function shotCommand(index,cmd){const sh=shotRecords[index];if(cmd==='add'||cmd==='duplicate'){shotRecords.splice(index+1,0,{...sh,id:'shot-'+Date.now(),status:'草稿'});markShotDownstreamStale();recordChange((cmd==='add'?'新增':'复制')+' Shot '+(index+1));render();toast('镜头草稿已新增');return}if(cmd==='delete'){showModal('删除 Shot '+(index+1),'将解除本镜头的节拍、对白、素材和关键帧映射；相关节拍标记为待补。','删除镜头',()=>{shotRecords.splice(index,1);markShotDownstreamStale();recordChange('删除 Shot '+(index+1));render();toast('镜头已删除')});return}const target=cmd==='up'?index-1:index+1;if((cmd==='up'&&index>0)||(cmd==='down'&&target<shotRecords.length)){[shotRecords[index],shotRecords[target]]=[shotRecords[target],shotRecords[index]];recordChange('调整镜头顺序');render();toast('镜头顺序已更新')}}
function openShotAdvanced(index=0){const sh=shotRecords[index]||shotRecords[0];showModal('Shot '+(index+1)+' · 高级参数',`<div class="workspace-grid"><div><label>轴线 / 方位</label><select id="advAxis"><option>遵循上一镜轴线</option><option>反打镜头</option><option>跨轴 · 需过渡镜头</option></select><label>焦距</label><select id="advLens"><option>35mm · 自然视角</option><option>50mm · 人像</option><option>85mm · 特写</option></select><label>运镜曲线</label><select id="advCurve"><option>固定机位</option><option>缓慢推近</option><option>平滑跟拍</option><option>先停顿后摇镜</option></select><label>镜头节奏</label><select id="advPace"><option>自然</option><option>缓慢强调</option><option>快速反应</option></select></div><div><label>环境声</label><input id="advSound" style="width:100%" value="${sh.sound||'气象站 · 海风与短波底噪'}"><label>镜头备注</label><textarea id="advNote" rows="4" style="width:100%">${sh.note||''}</textarea><label><input id="advBridge" type="checkbox" ${sh.bridge?'checked':''}> 标记为跨轴过渡镜头</label><p class="hint">检查动作方向、视线方向、上一镜轴线和场景方位。</p></div></div>`,'保存镜头参数',()=>{sh.axis=document.querySelector('#advAxis').value;sh.lens=document.querySelector('#advLens').value;sh.curve=document.querySelector('#advCurve').value;sh.pace=document.querySelector('#advPace').value;sh.sound=document.querySelector('#advSound').value;sh.note=document.querySelector('#advNote').value;sh.bridge=document.querySelector('#advBridge').checked;sh.status='已编辑';markShotDownstreamStale();recordChange('更新 Shot '+(index+1)+' 高级参数');render();toast('镜头参数已保存')})}
function drawShots(){let wrap=document.querySelector('#shots');if(!wrap)return;wrap.innerHTML=shotRecords.map((shot,idx)=>{const i=idx+1;return `<article class="shot"><div class="shothead"><span class="shotnum">› ${i}</span><span class="toolnote">时长</span><input aria-label="镜头 ${i} 时长" type="number" min="0.5" step="0.1" value="${shot.duration}" style="width:62px" onchange="updateShot(${idx},'duration',this.value)"> <span class="toolnote">秒</span><select aria-label="镜头 ${i} 景别" onchange="updateShot(${idx},'size',this.value)"><option ${shot.size==='中景 · medium'?'selected':''}>中景 · medium</option><option ${shot.size==='近景 · medium-close'?'selected':''}>近景 · medium-close</option><option>特写 · close-up</option><option>全景 · wide</option><option>中近景 · medium close-up</option></select><select aria-label="镜头 ${i} 运镜" onchange="updateShot(${idx},'move',this.value)"><option ${shot.move==='固定 · Static Shot'?'selected':''}>固定 · Static Shot</option><option>缓慢推近 · Slow Push-in</option><option>跟拍 · Tracking</option><option>摇镜 · Pan</option><option>手持 · Handheld</option></select><select aria-label="镜头 ${i} 机位" onchange="updateShot(${idx},'angle',this.value)"><option ${shot.angle==='朝向东南'?'selected':''}>朝向东南</option><option>朝向主位</option><option>俯视</option><option>反打机位</option></select><button class="icon" style="margin-left:auto" onclick="openShotAdvanced(${idx})">···</button></div><div class="shotbody"><div><div class="shotimg"></div><div class="shotrefs"><i class="refthumb"></i><i class="refthumb persref"></i><i class="refthumb persref"></i><button class="icon" onclick="openAssetPicker(${idx})">＋</button></div></div><div class="shotcopy"><div class="label">视频提示词［Shot ${i}］　本镜关键帧对应［Picture ${i}］</div><textarea aria-label="Shot ${i} 视频提示词" rows="3" oninput="updateShot(${idx},'prompt',this.value)">${shot.prompt}</textarea><div class="label">画面提示词　<button class="ghost" onclick="doAction('已复制提示词')">复制</button>　<button class="ghost" onclick="syncBeatToShot(${idx})">从剧本同步</button></div><textarea aria-label="Shot ${i} 画面提示词" rows="3" oninput="updateShot(${idx},'imagePrompt',this.value)">${shot.imagePrompt||shot.prompt}</textarea><div class="label">状态　<span class="tag ${shot.status==='已确认'?'ok':'warn'}">${shot.status}</span></div><input aria-label="Shot ${i} 连续性备注" value="${shot.note||''}" placeholder="动作、情绪、服装或连续性备注" oninput="updateShot(${idx},'note',this.value)" style="width:100%"></div></div><div class="shotfoot"><span>节拍 ${8+i}　·　对白映射 ${shot.dialogue?'已关联':'待确认'}</span><span><button class="icon" title="上移" onclick="shotCommand(${idx},'up')">↑</button> <button class="icon" title="下移" onclick="shotCommand(${idx},'down')">↓</button> <button class="icon" title="复制" onclick="shotCommand(${idx},'duplicate')">▢</button> <button class="icon" title="删除" onclick="shotCommand(${idx},'delete')">×</button> <button class="icon" title="新增" onclick="shotCommand(${idx},'add')">＋</button> <button onclick="confirmShot(${idx})">确认本镜</button></span></div></article>`}).join('')}
function syncBeatToShot(index){const s=shotRecords[index];s.prompt=shotLines[index%shotLines.length];s.status='已同步剧本';recordChange('Shot '+(index+1)+' 从剧本节拍同步');render();toast('动作已同步，请检查后确认')}
function confirmShot(index){const s=shotRecords[index];if(!s.prompt||!s.prompt.trim())return toast('请先填写视频提示词');if(!s.beatId)return toast('请先为镜头关联节拍，或在覆盖扫描中处理该节拍');if(!Number.isFinite(Number(s.duration))||Number(s.duration)<=0)return toast('镜头时长必须大于 0');s.status='已确认';recordChange('确认 Shot '+(index+1)+' · '+s.beatId);render();toast('镜头已确认，可生成关键帧')}
function queueVideo(){const shotGate=workflowState.shotDesign,kf=workflowState.keyframes,video=workflowState.video,ep=state.episode,approved=state.episodeKeyframeApprovals[ep]||{},issues=[];if(!['已确认','已豁免'].includes(shotGate.status)||shotGate.stale)issues.push('逐镜分镜阶段未验收或已过期');if(!['已确认','已豁免'].includes(kf.status)||kf.stale)issues.push('关键帧阶段未验收或已过期');const unconfirmed=shotRecords.filter(x=>x.status!=='已确认');if(unconfirmed.length)issues.push(unconfirmed.length+' 个镜头尚未确认');const missingFrames=shotRecords.filter(x=>x.status==='已确认'&&(!approved[x.id]||approved[x.id].stale));if(missingFrames.length)issues.push(missingFrames.length+' 个镜头没有有效的已接受关键帧');if(issues.length)return showModal('暂不能生成视频','<p>视频正式任务依赖逐镜分镜和关键帧双重门禁：</p><ul>'+issues.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul><p class="hint">修复失败候选或在阶段验收中记录可追溯的豁免。隔离探索仍不可进入交付。</p>','去处理依赖',()=>{state.page='storyboard';state.storyTab=unconfirmed.length?'shots':'batches';render()});if(!['进行中','待验收'].includes(video.status)||video.stale)return showModal('先开始视频阶段','<p>当前集输入门禁已通过；先开始视频阶段并确认服务路由，再提交镜头任务。</p>','打开视频阶段控制',()=>{openStageControl('video');return false});const profile=stageServiceOverride(video,'video'),batchId='video-batch-'+Date.now();shotRecords.forEach((shot,i)=>{const job=addTask('视频','第 '+ep+' 集 · Shot '+(i+1)+' 视频','批次 '+batchId+' · 首帧来自 '+approved[shot.id].candidateId+' · 镜头版本 '+shotGate.version,'video',profile);const t=tasks.find(x=>x.id===job);t.batchId=batchId;t.entityRef=shot.id;t.inputVersion=shotGate.version;t.frameCandidateId=approved[shot.id].candidateId});recordChange('提交逐镜视频生成 · 第 '+ep+' 集 · '+shotRecords.length+' 镜');render()}

document.querySelectorAll('.rail button[data-section]').forEach(b=>b.onclick=()=>navigate(b.dataset.section));render();
</script></body></html>
