function renderTaskActions(t){if(t.status==='等待授权')return '<button onclick="openTaskDataConsent(\''+t.id+'\')">授权并提交</button><button onclick="updateQueueTask(\''+t.id+'\',\'cancel\')">取消</button>';if(t.status==='待验收')return '<button onclick="reviewCandidate(\''+t.id+'\')">审阅候选</button>';if(t.status==='失败'||t.status==='已拒绝')return '<button onclick="updateQueueTask(\''+t.id+'\',\'retry\')">新 attempt 重试</button><button onclick="updateQueueTask(\''+t.id+'\',\'archive\')">归档</button>';if(t.status==='排队中'||t.status==='生成中')return '<button onclick="updateQueueTask(\''+t.id+'\',\'pause\')">暂停</button><button onclick="updateQueueTask(\''+t.id+'\',\'cancel\')">取消</button><button onclick="updateQueueTask(\''+t.id+'\',\'demoComplete\')">演示完成</button>';if(t.status==='等待门禁')return '<span class="tag warn">上游审阅/门禁通过后自动排队</span>';if(t.status==='已暂停')return '<button onclick="updateQueueTask(\''+t.id+'\',\'resume\')">继续</button><button onclick="updateQueueTask(\''+t.id+'\',\'cancel\')">取消</button>';return '<span class="tag ok">已处理</span>'}
function openQueue(){const active=tasks.filter(x=>!['已取消','已归档'].includes(x.status));const html=active.length?active.map(t=>'<div class="queueitem"><div class="queueicon">'+(t.type==='视频'?'▶':'▧')+'</div><div style="flex:1"><b>'+t.type+' · '+(t.episodeId?'第 '+t.episodeId+' 集 · ':'')+t.target+'</b><small style="display:block;color:var(--muted)">'+t.status+' · '+t.progress+'% · '+t.detail+(t.providerSnapshot?' · '+(t.providerSnapshot.mode==='local'?'本机':'API')+' · '+t.providerSnapshot.provider+' / '+t.providerSnapshot.model:'')+'</small><div class="bar"><i style="width:'+t.progress+'%"></i></div></div>'+'<span class="tag">'+t.status+'</span>'+renderTaskActions(t)+'</div>').join(''):'<div class="empty">队列为空。生成图片、视频或语音任务后会显示在这里。</div>';showModal('生成队列',html+'<div class="rightsection"><h4>队列控制</h4><p class="textblock"><b>演示模式：</b>“演示完成”只推进原型状态，不会调用模型或创建真实媒体文件。真实运行需配置 Provider 并由后台 Worker 执行。</p><label>并发上限</label><select onchange="state.concurrency=this.value;persistPrototype()"><option>3 个任务</option><option>1 个任务</option><option>5 个任务</option></select></div>','关闭')}

function serviceConfigCard(kind,title){const c=(state.services&&state.services[kind])||{};const options={text:['OpenAI-compatible Chat Completions','OpenAI Responses API','Gemini API','Ollama / LM Studio','自定义 HTTP API'],image:['OpenAI-compatible Image API','Gemini Image API','ComfyUI','自定义 HTTP API'],video:['OpenAI-compatible Video API','Seedance API','Wan API','ComfyUI','自定义异步 HTTP API']}[kind];const apiFields=kind==='video'?'<label>提交路径</label><input id="cfg-'+kind+'-submit" value="'+escapeHtml(c.submitPath||'/v1/videos')+'" style="width:100%"><label>状态查询路径（支持 {job_id}）</label><input id="cfg-'+kind+'-statusPath" value="'+escapeHtml(c.statusPath||'/v1/videos/{job_id}')+'" style="width:100%"><label>结果字段路径</label><input id="cfg-'+kind+'-resultPath" value="'+escapeHtml(c.resultPath||'data.output_url')+'" style="width:100%"><label>轮询间隔（秒）</label><input id="cfg-'+kind+'-poll" type="number" min="1" value="'+escapeHtml(c.pollSeconds||5)+'" style="width:90px">':kind==='image'?'<label>默认画幅 / 数量</label><div class="rightrow"><select id="cfg-image-ratio"><option '+(!c.ratio||c.ratio==='跟随镜头'?'selected':'')+'>跟随镜头</option><option '+(c.ratio==='1:1'?'selected':'')+'>1:1</option><option '+(c.ratio==='16:9'?'selected':'')+'>16:9</option><option '+(c.ratio==='9:16'?'selected':'')+'>9:16</option></select><select id="cfg-image-count"><option '+(!c.count||c.count==='1 张'?'selected':'')+'>1 张</option><option '+(c.count==='4 张'?'selected':'')+'>4 张</option><option '+(c.count==='批量'?'selected':'')+'>批量</option></select></div>':'<label>输出格式约束</label><select id="cfg-text-format"><option '+(!c.format||c.format==='JSON Schema（结构化阶段产物）'?'selected':'')+'>JSON Schema（结构化阶段产物）</option><option '+(c.format==='文本 + 引用标记'?'selected':'')+'>文本 + 引用标记</option></select><label>上下文窗口 / 超时策略</label><div class="rightrow"><input id="cfg-text-context" type="number" value="'+escapeHtml(c.context||64000)+'" style="width:120px"><select id="cfg-text-timeout"><option>120 秒</option><option>300 秒</option><option>600 秒</option></select></div>';return '<div class="card"><div class="cardtitle">'+title+' <span class="tag">'+(c.status||'未验证')+'</span></div><label>接入方式</label><select id="cfg-'+kind+'-mode"><option value="api" '+(c.mode!=='local'?'selected':'')+'>远程 / 自建 API</option><option value="local" '+(c.mode==='local'?'selected':'')+'>本机服务</option></select><label>Provider / 协议</label><select id="cfg-'+kind+'-provider">'+options.map(x=>'<option '+(c.provider===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label>服务档案名称（填写后可供节点单独调用）</label><input id="cfg-'+kind+'-profileName" value="'+escapeHtml(c.profileName||'')+'" placeholder="如：低成本云视频、ComfyUI 本机" style="width:100%"><label><input id="cfg-'+kind+'-makeDefault" type="checkbox" checked> 同时设为项目默认服务</label><label><input id="cfg-'+kind+'-consent" type="checkbox" '+(hasExternalDataConsent(kind,c)?'checked':'')+'> 授权此项目向当前服务档案发送对应模态内容</label><p class="hint">授权按模态、Provider、Endpoint 和模型绑定；修改任一项需重新授权。未授权任务会停在等待授权，不会发送。</p><label>API Base URL / 本机地址</label><input id="cfg-'+kind+'-url" value="'+escapeHtml(c.baseUrl||'')+'" placeholder="https://api.example.com/v1 或 http://127.0.0.1:8188" style="width:100%"><label>模型 ID</label><input id="cfg-'+kind+'-model" value="'+escapeHtml(c.model||'')+'" placeholder="填写服务端实际模型名称" style="width:100%"><label>认证方式</label><select id="cfg-'+kind+'-auth"><option value="bearer" '+(c.auth==='bearer'?'selected':'')+'>Bearer Token</option><option value="header" '+(c.auth==='header'?'selected':'')+'>自定义 Header</option><option value="none" '+(c.auth==='none'?'selected':'')+'>无认证 / 本机受信任服务</option></select><label>认证 Token（仅本次会话临时输入）</label><input id="cfg-'+kind+'-key" type="password" autocomplete="new-password" placeholder="正式版提交至后端密钥库；原型不会保存或发送" style="width:100%"><label>自定义认证 Header 名称（可选）</label><input id="cfg-'+kind+'-header" value="'+escapeHtml(c.headerName||'Authorization')+'" style="width:100%"><p class="hint">原型不读取 Token；正式版仅在服务端/Agent 注入请求，不回传明文。</p>'+apiFields+'<div class="rightrow"><button onclick="testProvider(\''+kind+'\')">检查配置（演示）</button><span class="hint">原型不发送请求</span></div></div>'}
function serviceProfilesPanel(kind,title){const list=state.serviceProfiles?.[kind]||[];return '<div class="card"><div class="cardtitle">'+title+' profiles <span class="hint">'+list.length+' 个已登记</span></div>'+(list.length?list.map(p=>'<div class="setting"><span>'+escapeHtml(p.name)+' · '+escapeHtml(p.model||'无模型')+' '+(state.serviceDefaults?.[kind]===p.id?'<span class="tag ok">项目默认</span>':'')+'</span><span><button onclick="loadServiceProfile(\''+p.id+'\',\''+kind+'\')">编辑</button> <button onclick="makeServiceDefault(\''+p.id+'\',\''+kind+'\')">设为默认</button> <button onclick="deleteServiceProfile(\''+p.id+'\',\''+kind+'\')">删除</button></span></div>').join(''):'<p class="hint">暂无命名档案。填写上方配置名称并保存即可创建。</p>')+'</div>'}
function loadServiceProfile(id,kind){const p=(state.serviceProfiles?.[kind]||[]).find(x=>x.id===id);if(!p)return toast('服务档案不存在');const set=(field,value)=>{const el=document.querySelector('#cfg-'+kind+'-'+field);if(el&&value!==undefined)el.value=value};set('mode',p.mode);set('provider',p.provider);set('url',p.baseUrl);set('model',p.model);set('auth',p.auth);set('header',p.headerName);set('profileName',p.name);const def=document.querySelector('#cfg-'+kind+'-makeDefault');if(def)def.checked=state.serviceDefaults?.[kind]===id;if(kind==='video'){set('submit',p.submitPath);set('statusPath',p.statusPath);set('resultPath',p.resultPath);set('poll',p.pollSeconds)}if(kind==='image'){set('ratio',p.ratio);set('count',p.count)}if(kind==='text'){set('context',p.context);set('timeout',p.timeout);const f=document.querySelector('#cfg-text-format');if(f&&p.format)f.value=p.format}toast('已载入档案；保存前可检查/修改字段')}
function makeServiceDefault(id,kind){const p=(state.serviceProfiles?.[kind]||[]).find(x=>x.id===id);if(!p)return toast('服务档案不存在');const {id:profileId,name,...config}=p;state.services[kind]={...config,profileName:name,status:'未验证',version:(state.services[kind]?.version||0)+1};state.serviceDefaults=state.serviceDefaults||{text:'',image:'',video:''};state.serviceDefaults[kind]=profileId;state.providers[kind]=kind==='text'?p.model:p.provider+' · '+p.model;recordChange('设置项目默认服务 · '+kind+' · '+name);persistPrototype();render();openSettings('项目默认')}
function deleteServiceProfile(id,kind){const p=(state.serviceProfiles?.[kind]||[]).find(x=>x.id===id);if(!p)return;if(state.serviceDefaults?.[kind]===id)return toast('先设置其他项目默认服务，再删除此档案');if(workflowStages.some(st=>workflowState[st.id]?.serviceProfileId===id)||graphNodes.some(n=>n.serviceProfileId===id))return toast('该档案仍被阶段/画布引用；先替换引用再删除');showModal('删除服务档案 · '+p.name,'<p>已运行任务保留各自服务快照；删除后新节点不能再选择该档案。</p><p class="hint">密钥引用不会自动删除，避免影响其他档案/项目；请在密钥管理中单独撤销。</p>','删除档案',()=>{state.serviceProfiles[kind]=state.serviceProfiles[kind].filter(x=>x.id!==id);recordChange('删除服务档案 · '+p.name);persistPrototype();setTimeout(()=>openSettings('项目默认'),0)})}
function normalizeServiceEndpoint(raw,mode,kind){let u;try{u=new URL(raw)}catch{throw Error(({text:'文本',image:'图片',video:'视频'}[kind])+'服务地址必须是完整的 http(s) URL')}if(!['http:','https:'].includes(u.protocol))throw Error('仅支持 http(s) 服务地址');if(u.username||u.password||u.search||u.hash)throw Error('服务地址不能含用户名、密码、查询参数或片段；请使用认证字段配置密钥');const loopback=['localhost','127.0.0.1','::1'].includes(u.hostname);if(mode==='api'&&u.protocol!=='https:'&&!loopback)throw Error('远程 API 必须使用 HTTPS；本机回环地址可使用 HTTP');return u.origin+u.pathname.replace(/\/$/,'')}
function openSettings(scope='项目默认'){state.services=state.services||{};showModal(scope+'模型与服务接入','<p class="textblock">文本、图片、视频分别配置；三类都支持远程 API、自建 API 和本机服务。正式版由服务端/本机 Agent 调用 Provider，浏览器不接触密钥。</p><div class="workspace-grid provider-grid">'+serviceConfigCard('text','文本理解 / 编排')+serviceConfigCard('image','图片 / 关键帧')+serviceConfigCard('video','视频生成')+'</div><div class="rightsection"><h4>已登记服务档案</h4><div class="workspace-grid provider-grid">'+serviceProfilesPanel('text','文本')+serviceProfilesPanel('image','图片')+serviceProfilesPanel('video','视频')+'</div><p class="hint">取消勾选“同时设为项目默认”可只新增/更新档案；档案可被画布节点单独引用。改动只影响新任务，运行快照不变。</p></div><div class="rightsection"><h4>任务协议说明</h4><p class="textblock">文本：同步/流式响应与结构化 JSON 校验。图片：同步或异步任务、参考图、画幅与多候选。视频：提交任务 ID、异步状态轮询/回调、取消与产物下载。</p><p class="hint">API Key 不进入 localStorage、项目文件、日志或导出包。Video API 需要 Provider Adapter；仅填 Base URL 不能假定各家协议相同。</p></div>','保存服务配置',()=>{const next={};for(const kind of ['text','image','video']){const val=id=>document.querySelector('#cfg-'+kind+'-'+id)?.value||'';const old=state.services[kind]||{};next[kind]={mode:val('mode'),provider:val('provider'),profileName:val('profileName').trim(),makeDefault:document.querySelector('#cfg-'+kind+'-makeDefault')?.checked!==false,baseUrl:normalizeServiceEndpoint(val('url').trim(),val('mode'),kind),model:val('model').trim(),externalDataConsent:document.querySelector('#cfg-'+kind+'-consent')?.checked===true,auth:val('auth'),headerName:document.querySelector('#cfg-'+kind+'-header')?.value.trim()||'Authorization',secretRef:old.secretRef||null,status:'未验证',version:(old.version||0)+1};if(kind==='text'){next[kind].format=document.querySelector('#cfg-text-format')?.value||'JSON Schema（结构化阶段产物）';next[kind].context=Number(document.querySelector('#cfg-text-context')?.value||64000);next[kind].timeout=document.querySelector('#cfg-text-timeout')?.value||'120 秒'}if(kind==='image'){next[kind].ratio=document.querySelector('#cfg-image-ratio')?.value||'跟随镜头';next[kind].count=document.querySelector('#cfg-image-count')?.value||'1 张'}if(kind==='video'){next[kind].submitPath=val('submit');next[kind].statusPath=val('statusPath');next[kind].resultPath=val('resultPath');next[kind].pollSeconds=Math.max(1,Number(val('poll'))||5)}}for(const kind of ['text','image','video']){if(!next[kind].baseUrl)throw Error(({text:'文本',image:'图片',video:'视频'}[kind])+'服务需要填写 API 地址或本机服务地址');if(!next[kind].model)throw Error(({text:'文本',image:'图片',video:'视频'}[kind])+'服务需要填写模型 ID')}const defaults={...(state.services||{})};for(const kind of ['text','image','video']){if(next[kind].makeDefault){defaults[kind]=next[kind];if(!next[kind].profileName)state.serviceDefaults=state.serviceDefaults||{text:'',image:'',video:''}}else if(!next[kind].profileName)throw Error('不设为项目默认时，必须填写服务档案名称')}state.services=defaults;state.serviceProfiles=state.serviceProfiles||{text:[],image:[],video:[]};state.serviceDefaults=state.serviceDefaults||{text:'',image:'',video:''};for(const kind of ['text','image','video']){const name=next[kind].profileName;if(name){const list=state.serviceProfiles[kind]||(state.serviceProfiles[kind]=[]);let profile=list.find(x=>x.name===name);if(!profile){profile={id:kind+'-profile-'+Date.now()+'-'+Math.floor(Math.random()*1000),name};list.push(profile)}const clean=JSON.parse(JSON.stringify(next[kind]));delete clean.makeDefault;delete clean.profileName;Object.assign(profile,clean,{id:profile.id,name});if(next[kind].makeDefault)state.serviceDefaults[kind]=profile.id}else if(next[kind].makeDefault)state.serviceDefaults[kind]=''}state.providers={text:state.services.text.model,image:state.services.image.provider+' · '+state.services.image.model,video:state.services.video.provider+' · '+state.services.video.model};recordChange('保存文本 / 图片 / 视频服务配置');toast('服务配置已保存（密钥未保存）');render()})}
function testProvider(kind){const c=state.services[kind]||{};const endpoint=document.querySelector('#cfg-'+kind+'-url')?.value.trim()||'';const model=document.querySelector('#cfg-'+kind+'-model')?.value.trim()||'';if(!endpoint)return toast('请先填写 API Base URL / 本机地址');if(!model)return toast('请先填写模型 ID');let valid=false;try{const u=new URL(endpoint);valid=['http:','https:'].includes(u.protocol)}catch{}if(!valid)return toast('地址格式无效，请使用 http(s) URL');showModal(({text:'文本',image:'图片',video:'视频'}[kind])+'服务配置检查','<p>地址格式和模型 ID 格式检查通过。</p><p><b>演示模式：未向 '+escapeHtml(endpoint)+' 发送网络请求，也未验证 API Key。</b></p><p class="textblock">正式版将由后端/本机 Agent 发起最小权限连接检查，返回协议、模型可用性、能力项和错误码；Key 仅存密钥库。</p>','知道了')}

function downloadText(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href);recordChange('导出文件 · '+name);toast(name+' 已导出')}
function exportCurrentScript(){const scenes=episodeScriptScenes(),cues=episodeDialogueCues();let out='# '+(state.sourceImport?.name||'叙帧项目')+' · 第 '+state.episode+' 集\n\n';scenes.forEach((s,i)=>{out+='## 场 '+String(i+1).padStart(2,'0')+' · '+s.location+'\n\n';out+='人物：'+s.characters+'\n节拍：'+s.beatStart+'–'+s.beatEnd+'\n时长：'+s.durationSeconds+' 秒\n\n'+s.action+'\n\n';cues.filter(c=>c.sceneIndex===i||!Number.isInteger(c.sceneIndex)&&i===0).forEach(c=>{out+='**'+(c.speaker||'待指定')+'**（'+(c.emotion||'')+'）：'+c.text+'\n\n'})});downloadText('episode-'+state.episode+'-script.md',out)}
function exportDialogueCsv(){const cues=episodeDialogueCues(),q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['id','speaker','text','emotion','duration_sec','start','end','shot_id'],...cues.map(c=>[c.id,c.speaker,c.text,c.emotion,c.duration,c.start,c.end,c.shotId])].map(row=>row.map(q).join(',')).join('\n');downloadText('episode-'+state.episode+'-dialogue.csv','\ufeff'+rows)}
function copyCurrentShotPrompt(){const sh=shotRecords[Math.max(0,(state.shot||1)-1)]||shotRecords[0];if(!sh)return toast('当前没有镜头提示词');const val=sh.prompt+'\n画面：'+(sh.imagePrompt||sh.prompt);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(val).then(()=>toast('当前镜头提示词已复制')).catch(()=>showModal('复制提示词','<textarea style="width:100%" rows="5">'+escapeHtml(val)+'</textarea><p class="hint">浏览器未授权剪贴板；可手动复制。</p>','关闭'));else showModal('复制提示词','<textarea style="width:100%" rows="5">'+escapeHtml(val)+'</textarea><p class="hint">浏览器未授权剪贴板；可手动复制。</p>','关闭')}
function applyContinuitySuggestion(){if(shotRecords.length<2)return toast('至少需要两个镜头才能检查反打连续性');const i=Math.min(3,shotRecords.length-1),sh=shotRecords[i],before={angle:sh.angle,prompt:sh.prompt};showModal('应用连续性建议 · Shot '+(i+1),'<p>建议：核对上一镜主位方向后，将本镜设置为反打机位并同步提示词中的方位描述。</p><div class="rightsection"><h4>当前 / 建议</h4><p>当前机位：'+escapeHtml(sh.angle||'未设定')+'<br>建议机位：反打机位（需按场景空间确认）</p></div><label><input id="axisApply" type="checkbox" checked> 应用建议并标记镜头待复核</label><label>修改依据</label><textarea id="axisReason" rows="2" style="width:100%" placeholder="例如：反打方向与 Shot 3 主位方位一致"></textarea>','应用并重审下游',()=>{if(!document.querySelector('#axisApply').checked)return false;const reason=document.querySelector('#axisReason').value.trim();if(!reason)throw Error('请记录应用该机位建议的理由');sh.previousAngle=before.angle;sh.angle='反打机位';sh.note=[sh.note,reason].filter(Boolean).join('；');sh.status='已修改待复核';markShotDownstreamStale();recordChange('应用连续性建议 · '+sh.id);render();toast('机位已更新；关键帧与视频需重新审核')})}
function recalculateShotDurations(){const total=shotRecords.reduce((n,x)=>n+(Number(x.duration)||0),0),target=Math.max(shotRecords.length*.5,total-1.2);showModal('重算镜头时长','<p>当前镜头总长 '+total.toFixed(1)+' 秒。选择目标总时长；系统按现有权重缩放，并保留每镜动作/对白备注。</p><label>目标总时长（秒）</label><input id="retimeTarget" type="number" min="'+(shotRecords.length*.5)+'" step="0.1" value="'+target.toFixed(1)+'" style="width:100%"><label>重分配方式</label><select id="retimeMode"><option value="weighted">按当前镜头时长比例缩放</option><option value="equal">平均分配（保留各镜最短 0.5 秒）</option></select><p class="hint">保存会产生新的分镜版本并使关键帧、视频和后期候选过期；确认前可取消。</p>','应用重算',()=>{const target=Number(document.querySelector('#retimeTarget').value),min=shotRecords.length*.5;if(!Number.isFinite(target)||target<min)throw Error('目标时长不能短于每镜 0.5 秒的总和');const weights=shotRecords.map(x=>document.querySelector('#retimeMode').value==='equal'?1:Math.max(.5,Number(x.duration)||.5)),sum=weights.reduce((a,b)=>a+b,0);let used=0;shotRecords.forEach((x,i)=>{const d=i===shotRecords.length-1?target-used:Math.max(.5,Math.round(target*weights[i]/sum*10)/10);x.duration=d;used+=d;x.status='已修改待复核'});markShotDownstreamStale();recordChange('按目标总时长重算镜头 · '+target+' 秒');render();toast('时长已重算；请复核节拍、对白与镜头连续性')})}
function openPostSettings(){const old=state.postSettings?.[state.episode]||{mix:'对白 + 环境声 + 配乐',subtitleLang:'简体中文',burnIn:true,musicRights:'项目授权音乐'};showModal('音频与字幕设置 · 第 '+state.episode+' 集','<label>混音轨道</label><select id="postMix">'+['对白 + 环境声 + 配乐','对白 + 环境声','仅对白'].map(x=>'<option '+(old.mix===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label>字幕语言</label><select id="postLang">'+['简体中文','繁体中文','English','中英双语'].map(x=>'<option '+(old.subtitleLang===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label><input id="postBurn" type="checkbox" '+(old.burnIn?'checked':'')+'> 烧录字幕入画</label><label>音乐 / 音效授权说明</label><input id="postRights" value="'+escapeHtml(old.musicRights)+'" style="width:100%"><p class="hint">保存设置会让当前后期合成版本待复核；仅重新处理受影响音轨/字幕，不自动覆盖已接受视频段。</p>','保存设置并生成更新候选',()=>{const next={mix:document.querySelector('#postMix').value,subtitleLang:document.querySelector('#postLang').value,burnIn:document.querySelector('#postBurn').checked,musicRights:document.querySelector('#postRights').value.trim()};if(!next.musicRights)throw Error('请填写音乐 / 音效权利说明');state.postSettings=state.postSettings||{};state.postSettings[state.episode]=next;markStageEdited('post','更新音频 / 字幕设置');const id=addTask('合成','第 '+state.episode+' 集 · 音轨 / 字幕更新',JSON.stringify(next),'post');const t=tasks.find(x=>x.id===id);t.postSettings={...next};toast('设置已保存并创建局部合成候选')})}
function openMediaPreview(){const ep=state.episode,accepted=state.episodeVideoApprovals[ep]||{},shots=shotRecords.map((x,i)=>'<div class="setting"><span>Shot '+(i+1)+' · '+escapeHtml(x.duration)+' 秒</span><span class="tag '+(accepted[x.id]&&!accepted[x.id].stale?'ok':'warn')+'">'+(accepted[x.id]&&!accepted[x.id].stale?'已接受候选':'没有有效媒体候选')+'</span></div>').join('');showModal('媒体预览 · 第 '+ep+' 集','<div class="preview"><div class="play">▶</div><div class="previewlabel">'+(Object.values(accepted).some(x=>!x.stale)?'媒体文件播放器待接入':'尚无真实视频文件')+'</div></div><div class="rightsection"><h4>镜头素材状态</h4>'+shots+'</div><p class="hint">当前 HTML 原型不生成、不播放真实视频；正式版需读取已接受候选的安全媒体 URL，并支持代理加载、时间码跳转和音轨/字幕切换。</p>','关闭预览')}

function editEpisodeScene(index=0){const sc=episodeScriptScenes()[index];if(!sc)return toast('当前集没有可编辑场次');const meta=state.episodeScripts[state.episode].sceneMeta?.[index]||{};showModal('场次编辑器 · 第 '+state.episode+' 集 · 场 '+(index+1),'<label>场次名称 / 地点</label><input id="epSceneLocation" value="'+escapeHtml(sc.location)+'" style="width:100%"><div class="workspace-grid"><div><label>内景 / 外景</label><select id="epSceneType"><option '+(meta.type==='内景'?'selected':'')+'>内景</option><option '+(meta.type==='外景'?'selected':'')+'>外景</option></select></div><div><label>时段</label><select id="epSceneTime">'+['日','黄昏','夜','清晨'].map(x=>'<option '+(meta.time===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><label>人物目标与场景动作 / 冲突</label><textarea id="epSceneAction" rows="5" style="width:100%">'+escapeHtml(sc.action)+'</textarea><div class="workspace-grid"><div><label>出场人物</label><input id="epSceneCharacters" value="'+escapeHtml(sc.characters)+'" style="width:100%"></div><div><label>节拍范围</label><div class="rightrow"><input id="epSceneStart" type="number" min="1" value="'+sc.beatStart+'"><span>–</span><input id="epSceneEnd" type="number" min="1" value="'+sc.beatEnd+'"></div></div></div><label>场景连续性备注</label><textarea id="epSceneNote" rows="2" style="width:100%">'+escapeHtml(meta.note||'')+'</textarea><p class="hint">保存会升级当前集剧本版本，使对白映射、分镜、关键帧和视频候选按依赖关系待复核。</p>','保存场次版本',()=>{const location=document.querySelector('#epSceneLocation').value.trim(),characters=document.querySelector('#epSceneCharacters').value.trim(),start=Number(document.querySelector('#epSceneStart').value),end=Number(document.querySelector('#epSceneEnd').value),action=document.querySelector('#epSceneAction').value.trim();if(!location||!characters||!action)throw Error('地点、出场人物和可拍摄动作必填');if(start<1||end<start)throw Error('节拍范围无效');const book=state.episodeScripts[state.episode];book.sceneMeta=book.sceneMeta||{};book.sceneMeta[index]={type:document.querySelector('#epSceneType').value,time:document.querySelector('#epSceneTime').value,note:document.querySelector('#epSceneNote').value.trim()};updateEpisodeScene(index,'location',location);updateEpisodeScene(index,'characters',characters);updateEpisodeScene(index,'action',action);updateEpisodeScene(index,'beatStart',start);updateEpisodeScene(index,'beatEnd',end);recordChange('保存场次编辑 · '+location);render();toast('场次已保存；下游候选待复核')})}
function addCurrentShot(action){const i=Math.max(0,Math.min(shotRecords.length-1,(state.shot||1)-1)),base=shotRecords[i];if(action==='delete'){if(shotRecords.length<=1)return toast('至少保留一个镜头');return showModal('删除当前镜头','将删除 Shot '+(i+1)+'，解除其对白/节拍/素材映射，并使后续镜头编号重排。','删除镜头',()=>{const removed=shotRecords.splice(i,1)[0];for(const c of episodeDialogueCues())if(c.shotId===removed.id)c.shotId='';state.shot=Math.max(1,Math.min(i+1,shotRecords.length));markShotDownstreamStale();recordChange('删除镜头 · '+removed.id);render();toast('镜头已删除；相关台词重新待映射')})}const clone={...base,id:'shot-'+Date.now(),status:'草稿',beatId:'',dialogue:'',prompt:base?.prompt||'',imagePrompt:base?.imagePrompt||''};shotRecords.splice(i+1,0,clone);state.shot=i+2;markShotDownstreamStale();recordChange((action==='duplicate'?'复制':'新增')+'镜头 · '+clone.id);render();toast(action==='duplicate'?'镜头副本已创建':'新镜头草稿已创建')}

function runAllQualityChecks(){const ep=state.episode,checks=[];const add=(name,ok,detail,stage)=>checks.push({name,ok,detail,stage});add('原文结构与出处',!!state.sourceImport?.structureConfirmed&&state.sourceImport?.batches?.every(x=>x.parseStatus==='已解析'&&x.rights)&&sourceAnalysisGateReady(),state.sourceImport?.originalRelease?'原创范围版、章节版本与连续性报告引用':'章节结构、权利和 AI 分析证据核对', 'source');add('改编大纲',state.outlineChecks?.version===workflowState.outline.version&&!!state.outlineChecks?.passed,state.outlineChecks?.issues?.join('；')||'当前大纲检查结果','outline');const incompleteRoles=characterNames.filter(n=>state.characterCards[n]?.kind!=='客串').filter(n=>{const c=state.characterCards[n]||{};return !c.appearance||!c.behavior||!c.evidence||!c.voice||!c.voicePace});add('主要角色卡',!incompleteRoles.length,incompleteRoles.length?'待补：'+incompleteRoles.join('、'):'主要角色字段已齐','characters');add('美术基线',!!state.styleBibleConfirmed,'画风确认、场景/道具连续性与引用资产','art');const scenes=episodeScriptScenes(),totalSeconds=scenes.reduce((n,x)=>n+Number(x.durationSeconds||0),0),minSeconds=Number(state.adaptationSettings?.minMinutes||2)*60,maxSeconds=Number(state.adaptationSettings?.maxMinutes||5)*60,badScenes=scenes.filter(x=>!x.location||!x.characters||!x.action||x.durationSeconds<=0||x.beatEnd<x.beatStart);add('分集剧本',scenes.length>0&&badScenes.length===0&&totalSeconds>=minSeconds&&totalSeconds<=maxSeconds,!scenes.length?'尚无已生成场次':badScenes.length?'有 '+badScenes.length+' 个场次字段待修':totalSeconds+' 秒 / 目标 '+minSeconds+'–'+maxSeconds+' 秒','script');const unconfirmed=shotRecords.filter(x=>x.status!=='已确认'),unmapped=episodeDialogueCues().filter(x=>!x.shotId);add('逐镜分镜与对白覆盖',shotRecords.length>0&&!unconfirmed.length&&!unmapped.length,(unconfirmed.length?'未确认镜头 '+unconfirmed.length+'；':'')+(unmapped.length?'未映射对白 '+unmapped.length:'')||'镜头/对白覆盖完整','shotDesign');const frames=state.episodeKeyframeApprovals[ep]||{},missingFrames=shotRecords.filter(x=>!frames[x.id]||frames[x.id].stale);add('关键帧候选',shotRecords.length>0&&!missingFrames.length,'有效 '+(shotRecords.length-missingFrames.length)+' / '+shotRecords.length+' 镜','keyframes');const videos=state.episodeVideoApprovals[ep]||{},missingVideos=shotRecords.filter(x=>!videos[x.id]||videos[x.id].stale);add('视频候选',shotRecords.length>0&&!missingVideos.length,'有效 '+(shotRecords.length-missingVideos.length)+' / '+shotRecords.length+' 镜','video');const reports=checks.map(c=>'<div class="setting"><span class="tag '+(c.ok?'ok':'warn')+'">'+(c.ok?'通过':'待处理')+'</span><span style="flex:1">'+escapeHtml(c.name)+' · '+escapeHtml(c.detail)+'</span><button onclick="closeModal();openStageControl(\''+c.stage+'\')">查看</button></div>').join('');state.qualityReports=state.qualityReports||{};state.qualityReports[ep]={checks,at:new Date().toISOString()};persistPrototype();showModal('质量检查 · 第 '+ep+' 集','<p>自动规则只能发现结构与版本问题；剧情、表演、画面质量仍需人工审片。以下结果不会自动接受任何候选。</p>'+reports+'<p class="hint">报告时间：'+new Date().toLocaleString('zh-CN')+'</p>','关闭')}

function queueActionLegacy(label){if(label.includes('新建场景'))return showModal('新建场景',inputField('场景名称','entityName','','例如：南汀岛旧气象站·客厅')+inputField('场景描述','entityDesc','','空间、光线、时间与陈设'),'创建场景',()=>{let n=document.querySelector('#entityName').value.trim();if(!n)throw Error('请填写场景名称');const description=document.querySelector('#entityDesc').value.trim();if(projectScenes.includes(n))throw Error('场景名称已存在');projectScenes.push(n);state.sceneCards[n]={description,space:description,anchorStatus:'待生成',sourceEvidence:'待补充来源/章节依据'};markStageEdited('art','新建场景 · '+n);render();toast('场景已加入项目')});if(label.includes('新建道具'))return showModal('新建道具',inputField('道具名称','entityName','','例如：潮位记录簿')+inputField('外观与剧情用途','entityDesc','','材质、颜色、出现章节和连续性约束'),'创建道具',()=>{let n=document.querySelector('#entityName').value.trim();if(!n)throw Error('请填写道具名称');const appearance=document.querySelector('#entityDesc').value.trim();if(projectProps.includes(n))throw Error('道具名称已存在');projectProps.push(n);state.propCards[n]={appearance,purpose:appearance,state:'待确认',evidence:'待补充出处',anchorStatus:'待生成'};markStageEdited('art','新建道具 · '+n);render();toast('道具已加入项目')});if(label.startsWith('编辑道具：'))return editProp(label.slice('编辑道具：'.length));if(label.includes('新增剧情节点')||label.includes('条目'))return showModal('新增大纲节点',inputField('节点标题','outlineTitle','','冲突 / 转折 / 结尾钩子')+'<label>归类</label><select id="outlineBucket"><option value="keep">保留</option><option value="adapt">改编</option><option value="merge">合并</option><option value="remove">删除</option></select>','添加节点',()=>{let n=document.querySelector('#outlineTitle').value.trim(),k=document.querySelector('#outlineBucket').value;if(!n)throw Error('请填写节点标题');outlineItems[k].push(n);markStageEdited('outline','新增大纲节点 · '+n);render();toast('大纲节点已新增')});if(label.includes('已将缺失角色加入图片队列')||label.includes('已加入锚点图生成队列'))return queueMissingRoleAnchors();if(label.includes('批量生成场景视图')||label.includes('正在排队生成场景视图'))return queueMissingSceneViews();if(label.includes('已将批次加入图片生成队列'))ret function openImportModal(){showModal('导入小说 / 添加原文批次','<p class="hint">追加模式会保留已导入章节；替换模式更新当前演示工作区，旧批次保留在导入历史中。本原型尚未支持多个项目并行切换。</p>'+inputField('项目名称','importTitle',state.sourceImport?.name||'新短剧项目')+'<label>导入方式</label><select id="sourceImportMode"><option value="append" '+(state.sourceImport?'selected':'')+'>追加到当前小说（保留原章节）</option><option value="replace" '+(!state.sourceImport?'selected':'')+'>新建 / 替换当前演示工作区原文</option></select><label>原文文件（TXT / MD 可在本地读取；DOCX / PDF 当前为待接入解析器）</label><input id="sourcePicker" type="file" accept=".txt,.md,.docx,.pdf" style="width:100%"><label>或粘贴小说原文</label><textarea id="sourceText" rows="6" placeholder="粘贴完整章节文本；可分批续传" style="width:100%"></textarea><label>来源 / 权利状态</label><select id="sourceRights"><option value="">请选择（必填）</option><option>自有版权</option><option>已获授权</option><option>公有领域</option><option>待核实 · 仅内部评估</option></select><label>权利人 / 来源说明</label><input id="sourceOwner" style="width:100%" placeholder="作者、出版社、授权合同编号或来源链接"><label><input id="sourceBatch" type="checkbox" checked> 按批次续传并保留章节顺序</label><p class="hint">原型不会上传文件；不支持的文件类型会标为“待解析”，需要粘贴已提取文本后才能确认章节。</p>','创建导入批次',async()=>{const f=document.querySelector('#sourcePicker').files[0],paste=document.querySelector('#sourceText').value.trim(),title=document.querySelector('#importTitle').value.trim(),rights=document.querySelector('#sourceRights').value,owner=document.querySelector('#sourceOwner').value.trim();if(!f&&!paste)throw Error('请选择文件或粘贴小说原文');if(!rights)throw Error('请记录来源 / 权利状态');let text=paste,parseStatus='已解析',parseMessage='原型本地解析完成';if(f&&['text/plain','text/markdown',''].includes(f.type)||f&&/\.(txt|md)$/i.test(f.name)){text=await f.text();parseStatus=text.trim()?'已解析':'解析为空';parseMessage='读取 '+f.name+'；请核对章节切分与顺序'}else if(f&&!paste){parseStatus='待解析';parseMessage='当前原型未接入 DOCX / PDF 解析器；请粘贴提取后的文本后继续'}if(!text)parseStatus='待解析';const name=title||((f&&f.name)||'新短剧项目').replace(/\.[^.]+$/,'');const batchId='import-'+Date.now(),mode=document.querySelector('#sourceImportMode').value,existing=state.sourceImport,chapters=parseNovelText(text).map(ch=>({...ch,id:batchId+'-'+ch.id,batchId})),batch={batchId,filename:f?.name||'粘贴文本',size:f?.size||text.length,rights,owner,parseStatus,parseMessage,chapters:chapters.map(x=>x.id),text,createdAt:new Date().toISOString()};if(mode==='append'&&existing){existing.batches=existing.batches||[{batchId:existing.batchId,filename:state.sourceFile?.name||'历史批次',rights:existing.rights,owner:existing.owner,chapters:(existing.chapters||[]).map(x=>x.id),text:state.sourceText||'',parseStatus:existing.parseStatus||'已解析',createdAt:existing.createdAt}];existing.batches.push(batch);existing.chapters.push(...chapters);existing.name=name;existing.rights='多批次 · 逐批记录';existing.owner='逐批记录';existing.parseStatus=parseStatus;existing.parseMessage='累计 '+existing.batches.length+' 个批次；'+parseMessage;existing.structureConfirmed=false;state.sourceText=[state.sourceText,text].filter(Boolean).join('\n\n')}else{if(existing)state.archivedSourceImports=(state.archivedSourceImports||[]).concat([{name:existing.name,batches:existing.batches||[],archivedAt:new Date().toISOString()}]);state.sourceImport={batchId,name,rights,owner,parseStatus,parseMessage,chapters,batches:[batch],createdAt:new Date().toISOString(),structureConfirmed:false};state.sourceText=text}document.querySelector('#projectName').textContent=name;state.sourceFile=f?{name:f.name,size:f.size,type:f.type}:null;workflowState.source.parentVersion=workflowState.source.version;workflowState.source.version++;workflowState.source.status='进行中';workflowState.source.stale=false;invalidateStageDescendants('source');recordChange((mode==='append'?'追加':'创建')+'原文导入批次 · '+name);state.page='source';render();toast(parseStatus==='已解析'?'导入完成，请审阅章节结构':'导入批次已创建，解析待完成')})}

function parseNovelText(text){const clean=String(text||'').replace(/\r/g,'').trim();if(!clean)return [];const lines=clean.split('\n'),heads=[];for(let i=0;i<lines.length;i++)if(/^\s*(第[一二三四五六七八九十百千万零〇0-9]+[章节回卷部篇].*|Chapter\s+\d+.*)$/i.test(lines[i]))heads.push(i);if(!heads.length)return [{id:'chapter-'+Date.now(),title:'未识别章节（待拆分）',content:clean,included:true,warning:'未找到章节标题；请确认是否为单章，或手动拆分'}];const out=[];for(let j=0;j<heads.length;j++){const from=heads[j],to=heads[j+1]??lines.length,title=lines[from].trim(),body=lines.slice(from+1,to).join('\n').trim();out.push({id:'chapter-'+Date.now()+'-'+j,title,content:body,included:true,warning:body?'':'章节内容为空，请检查切分'})}const seen=new Set();for(const ch of out){const key=ch.title.replace(/\s+/g,'').toLowerCase();if(seen.has(key))ch.warning=(ch.warning?ch.warning+'；':'')+'章节标题重复';seen.add(key)}return out}

function updateSourceText(){const input=document.querySelector('#sourceTextReview')?.value||'';if(!input.trim())return toast('请先粘贴提取后的原文');const imp=state.sourceImport,batch=imp?.batches?.findLast(x=>x.parseStatus==='待解析')||imp?.batches?.at(-1);if(!imp||!batch)return toast('没有等待解析的导入批次');const chapters=parseNovelText(input).map(ch=>({...ch,id:batch.batchId+'-'+ch.id,batchId:batch.batchId}));imp.chapters=imp.chapters.filter(x=>x.batchId!==batch.batchId).concat(chapters);batch.text=input;batch.chapters=chapters.map(x=>x.id);batch.parseStatus='已解析';batch.parseMessage='粘贴文本已解析并保留导入批次来源';imp.parseStatus=imp.batches.some(x=>x.parseStatus==='待解析')?'待解析':'已解析';imp.parseMessage='累计 '+imp.batches.length+' 个批次；'+batch.parseMessage;imp.structureConfirmed=false;state.sourceText=imp.batches.map(x=>x.text||'').filter(Boolean).join('\n\n');const seen=new Set();for(const ch of imp.chapters){const key=ch.title.replace(/\s+/g,'').toLowerCase();if(seen.has(key))ch.warning=(ch.warning?ch.warning+'；':'')+'跨批次重复章节标题';seen.add(key)}recordChange('补入导入批次文本并重跑解析');persistPrototype();render();toast('当前批次解析完成，请复核章节')} 

function runSourceAnalysis(){const imp=state.sourceImport;if(imp?.originalRelease)return toast('原创路径使用已锁定的 ManuscriptRelease 和逐章来源；无需重复运行原文事实抽取');if(!imp?.structureConfirmed)return toast('先确认章节结构，再运行 AI 原文分析');if((imp.batches||[]).some(b=>b.parseStatus!=='已解析'))return toast('有批次尚未解析；先完成 TXT/MD 读取或补入 DOCX/PDF 提取文本');if(!['进行中','待验收'].includes(workflowState.source.status)||workflowState.source.stale)return showModal('先启动原文分析阶段','<p>原文分析需要锁定章节结构、权利状态和当前文本服务版本。</p>','打开原文阶段控制',()=>{openStageControl('source');return false});showModal('AI 原文分析 · 生成抽取候选','<p>模型先按章节分块抽取，候选必须回跳原文位置；模型推断单独标记，不能自动写成原著事实。</p><label>分析范围</label><select id="analysisScope"><option value="all">全部已包含章节</option><option value="changed">仅未分析 / 已变更章节</option></select><label>抽取项</label><div class="assetbox"><label><input type="checkbox" data-analysis="facts" checked> 事实、事件、因果、时间线</label><label><input type="checkbox" data-analysis="characters" checked> 人物、别名、关系、人物弧线</label><label><input type="checkbox" data-analysis="dialogue" checked> 对白、说话人、潜台词/动作</label><label><input type="checkbox" data-analysis="scene" checked> 场景、地点、道具、视觉状态</label><label><input type="checkbox" data-analysis="hooks" checked> 伏笔、悬念、信息揭露顺序</label></div><div class="workspace-grid"><div><label>长文策略</label><select id="analysisChunk"><option>按章切块 + 全书记忆检索</option><option>按章节范围分批分析</option></select></div><div><label>不确定事实阈值</label><select id="analysisConfidence"><option>保守 · 低置信度标待核实</option><option>平衡</option></select></div></div><label>补充分析约束</label><textarea id="analysisRules" rows="3" style="width:100%" placeholder="例如：重点核查身份揭露顺序，不要推断人物心理为确定事实"></textarea><p class="hint">提交将冻结章节 ID/版本、范围、抽取 schema、chunk 策略、文本模型和 prompt 版本。当前原型只创建演示候选。</p>','创建分析任务',()=>{const categories=[...document.querySelectorAll('#modalBody input[data-analysis]:checked')].map(x=>x.dataset.analysis);if(!categories.length)throw Error('至少选择一个抽取类别');const input={scope:document.querySelector('#analysisScope').value,categories,chunk:document.querySelector('#analysisChunk').value,confidence:document.querySelector('#analysisConfidence').value,rules:document.querySelector('#analysisRules').value.trim(),sourceVersion:workflowState.source.version,chapterIds:(imp.chapters||[]).filter(c=>c.included!==false).map(c=>c.id)};const id=addTask('文本','小说原文结构化分析候选',categories.join('、')+' · '+input.chapterIds.length+' 章 · 原文 v'+input.sourceVersion,'source',stageServiceOverride(workflowState.source,'text'));const t=tasks.find(x=>x.id===id);t.sourceAnalysis=true;t.analysisInput=input;state.sourceAnalysis={status:'生成中',taskId:id,inputVersion:input.sourceVersion,version:(state.sourceAnalysis?.version||0)+1};recordChange('提交原文结构化分析 · '+input.chapterIds.length+' 章');persistPrototype();render();toast('分析任务已建立；完成后逐项核对出处，再验收原文阶段')})}
function confirmSourceAnalysis(){const a=state.sourceAnalysis;if(!a||a.status!=='候选已接受')return toast('先从任务队列接受一份分析候选');showModal('原文分析 · 证据核对门','<p>正式进入改编大纲前，请确认抽取项均带可回跳原文出处、推断与原著事实分离、低置信度内容已标记，且分析覆盖了本次选择范围。</p><label><input id="sourceEvidenceOk" type="checkbox"> 抽取事实均附原文章节/段落定位</label><label><input id="sourceInferenceOk" type="checkbox"> 推断项已与原文事实分开，低置信度项标记待核</label><label><input id="sourceCoverageOk" type="checkbox"> 章节覆盖、人物/事件/对白/场景缺项已检查</label><label>需后续核验事项</label><textarea id="sourceAnalysisNotes" rows="3" style="width:100%" placeholder="无则写“无”；未确认的事实不得进入正式大纲"></textarea><p class="hint">确认分析候选不等于确认原文权利或改编大纲；后续仍有独立阶段门禁。</p>','确认分析结果',()=>{if(!['sourceEvidenceOk','sourceInferenceOk','sourceCoverageOk'].every(id=>document.querySelector('#'+id).checked))throw Error('请完成三项证据与覆盖确认');a.status='已确认';a.confirmedAt=new Date().toISOString();a.notes=document.querySelector('#sourceAnalysisNotes').value.trim();a.confirmedSourceVersion=workflowState.source.version;recordChange('确认原文 AI 分析候选与证据');persistPrototype();render();toast('原文分析已确认；仍需单独通过原文阶段验收')})}
function confirmSourceStructure(){const imp=state.sourceImport;if(!imp)return toast('请先创建导入批次');const chapters=(imp.chapters||[]).filter(x=>x.included!==false);if((imp.batches||[]).some(b=>b.parseStatus!=='已解析'))return toast('仍有导入批次等待解析，请先补入提取文本');if(!chapters.length||chapters.some(x=>!x.content.trim()))return toast('至少需要一个已包含且有正文的章节');if(chapters.some(x=>x.warning))return toast('请先处理解析警告，再确认章节结构');if(!imp.rights||!(imp.batches||[]).every(b=>b.rights))return toast('请为每个导入批次记录来源 / 权利状态');imp.structureConfirmed=true;imp.parseStatus='已确认章节结构';imp.confirmedAt=new Date().toISOString();workflowState.source.status='待验收';recordChange('确认原文章节结构 · '+chapters.length+' 章');persistPrototype();render();toast('章节结构已提交；还需通过原文阶段门禁')}
function moveSourceContent(){const ch=state.sourceImport?.chapters.find(x=>x.id===document.querySelector('#splitChapter')?.value);if(!ch)return;const text=document.querySelector('#splitText')?.value.trim();if(!text)return toast('请粘贴待拆分的内容');const parts=text.split(/\n(?=\s*第[一二三四五六七八九十百千万零〇0-9]+[章节回卷部篇])/);ch.content=parts.shift()||ch.content;for(const part of parts)state.sourceImport.chapters.push({id:'chapter-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),title:(part.split('\n')[0]||'新章节').trim(),content:part.replace(/^[^\n]*\n?/,'').trim(),included:true,warning:''});ch.warning='';state.sourceImport.structureConfirmed=false;persistPrototype();render();toast('章节拆分已保存')}

function generateOutline(){const source=workflowState.source;if(!['已确认','已豁免'].includes(source.status)||source.stale)return showModal('大纲生成被原文门禁阻止','<p>先完成原文批次解析、章节确认和来源记录。</p>','打开原文阶段',()=>{state.page='source';render();openStageControl('source');return false});const st=workflowState.outline;if(!['进行中','待验收'].includes(st.status)||st.stale)return showModal('先开始 / 重开大纲阶段','<p>生成大纲候选前需锁定原文版本与改编目标。</p>','打开大纲阶段控制',()=>{openStageControl('outline');return false});showModal('生成改编大纲草稿','<label>改编方向</label><select id="outlineMode">'+[['忠实','忠实改编 · 保留主线与关键事实'],['融合','融合改编 · 合并重复支线'],['重构','重构改编 · 允许调整事件顺序']].map(([k,label])=>'<option '+(String(state.adaptationSettings?.mode||'忠实').includes(k)?'selected':'')+'>'+label+'</option>').join('')+'</select><label>目标集数</label><input id="outlineEpisodes" type="number" min="1" value="'+(state.adaptationSettings?.episodes||10)+'" '+(state.sourceImport?.originalRelease?'readonly title="由已接受的逐集映射决定；修改需重新生成映射候选"':'')+' style="width:100%"><label>每集时长（分钟）</label><div class="rightrow"><input id="outlineMin" type="number" value="2"><input id="outlineMax" type="number" value="5"></div><label>必须保留 / 禁止改写</label><textarea id="outlineConstraints" rows="4" style="width:100%" placeholder="列出核心事实、不能提前揭露的信息、角色行为红线">'+escapeHtml(state.adaptationSettings?.constraints||'')+'</textarea><p class="hint">生成仅创建待审候选；每条保留、改编、合并或删除决策还要关联原文章节/段落。</p>','加入文本生成队列',()=>{const count=Number(document.querySelector('#outlineEpisodes').value),min=Number(document.querySelector('#outlineMin').value),max=Number(document.querySelector('#outlineMax').value);if(count<1||min<=0||max<min)throw Error('集数或目标时长范围无效');if(state.sourceImport?.originalRelease&&count!==Number(state.adaptationSettings?.episodes))throw Error('原创交接的集数已由逐集映射锁定；请先重做映射候选');state.adaptationSettings={...state.adaptationSettings,mode:document.querySelector('#outlineMode').value,episodes:count,minMinutes:min,maxMinutes:max,constraints:document.querySelector('#outlineConstraints').value.trim()};const mappingContext=state.sourceImport?.originalRelease?' · 已接受逐集映射：\n'+(state.adaptationSettings.mappingPlan||[]).join('\n')+' · ManuscriptRelease '+state.adaptationSettings.manuscriptReleaseId:'';addTask('文本','改编大纲候选 · '+count+' 集',state.adaptationSettings.mode+' · 来源版本 '+workflowState.source.version+mappingContext+' · '+(state.adaptationSettings.constraints||'无额外约束'),'outline',stageServiceOverride(st,'text'))})}
function editOutlineItem(bucket,index){const list=outlineItems[bucket],item=list[index],key=bucket+':'+item,e=state.outlineEvidence[key]||{};showModal('剧情取舍 · '+({keep:'保留',adapt:'改编',merge:'合并',remove:'删除'}[bucket]),'<label>决策说明</label><textarea id="outlineDecision" rows="3" style="width:100%">'+escapeHtml(item)+'</textarea><label>原文证据 / 章节段落位置</label><input id="outlineSourceRef" value="'+escapeHtml(e.sourceRef||'')+'" placeholder="第 12 章 · 段落 4-6" style="width:100%"><label>取舍理由与影响集数</label><textarea id="outlineReason" rows="3" style="width:100%">'+escapeHtml(e.reason||'')+'</textarea><label><input id="outlineNoSource" type="checkbox" '+(e.noSource?'checked':'')+'> 此项来自用户创作指令，无原文依据（说明理由）</label><p class="hint">删除项也要保留原文证据和取舍理由；模型推断不能伪装成原著事实。</p>','保存取舍依据',()=>{const decision=document.querySelector('#outlineDecision').value.trim(),sourceRef=document.querySelector('#outlineSourceRef').value.trim(),reason=document.querySelector('#outlineReason').value.trim(),noSource=document.querySelector('#outlineNoSource').checked;if(!decision||!reason||(!sourceRef&&!noSource))throw Error('决策说明、理由及原文证据（或明确无来源标记）必填');list[index]=decision;state.outlineEvidence[bucket+':'+decision]={sourceRef,reason,noSource};if(key!==bucket+':'+decision)delete state.outlineEvidence[key];markStageEdited('outline','更新剧情取舍依据');persistPrototype();render();toast('剧情取舍和原文依据已保存')})}
function runOutlineChecks(){const issues=[],isOriginal=!!state.sourceImport?.originalRelease;if(!String(state.storyCore||'').trim())issues.push('故事核心为空');if(isOriginal){const map=state.adaptationSettings?.mappingPlan||[],count=Number(state.adaptationSettings?.episodes)||0,accepted=tasks.some(t=>t.stageId==='outline'&&t.status==='已接受'&&t.stageVersion===workflowState.outline.version);if(!originalSourceReleaseValid())issues.push('原创 ManuscriptRelease 或章节版本已过期');if(!count||map.length!==count)issues.push('已接受逐集映射与目标集数不一致');if(!accepted)issues.push('尚无当前大纲版本的已接受生成候选')}else{if(!(outlineItems.keep||[]).length)issues.push('没有必保留剧情');for(const [bucket,items] of Object.entries(outlineItems))for(const item of items){const e=state.outlineEvidence[bucket+':'+item];if(!e?.reason||(!e.sourceRef&&!e.noSource))issues.push(({keep:'保留',adapt:'改编',merge:'合并',remove:'删除'}[bucket]||bucket)+'项缺少原文依据 / 理由：'+item)}}state.outlineChecks={version:workflowState.outline.version,issues,passed:issues.length===0,at:new Date().toISOString(),sourceMode:isOriginal?'original':'adaptation'};persistPrototype();render();toast(issues.length?'大纲检查发现 '+issues.length+' 项待处理':'大纲规则检查通过，仍需人工验收')}
function openAdaptationSettings(){
 const cfg=state.adaptationSettings||{},original=!!state.sourceImport?.originalRelease;
 const genreOptions=['都市情感','悬疑','古装','奇幻','科幻','其他'].map(x=>'<option '+((cfg.genre||'都市情感')===x?'selected':'')+'>'+x+'</option>').join('');
 const modeOptions=[['忠实','忠实 · 保留主线和人物关系'],['融合','融合 · 压缩重复冲突'],['重构','重构 · 允许调整因果和顺序']].map(([key,label])=>'<option '+(String(cfg.mode||'忠实').includes(key)?'selected':'')+'>'+label+'</option>').join('');
 showModal('改编参数','<div class="workspace-grid"><div><label>题材</label><select id="adaptGenre">'+genreOptions+'</select><label>总集数</label><input id="episodeCount" type="number" min="1" value="'+Number(cfg.episodes||10)+'" '+(original?'readonly title="由已接受的逐集映射决定"':'')+' style="width:100%"><label>单集时长范围</label><div class="rightrow"><input id="adaptMin" type="number" min="0.5" step="0.5" value="'+Number(cfg.minMinutes||2)+'" style="width:80px">–<input id="adaptMax" type="number" min="0.5" step="0.5" value="'+Number(cfg.maxMinutes||5)+'" style="width:80px"><span class="toolnote">分钟</span></div><label>画面比例</label><select id="adaptAspect"><option '+((state.aspectRatio||'16:9')==='16:9'?'selected':'')+'>16:9 横屏</option><option '+((state.aspectRatio||'16:9')==='9:16'?'selected':'')+'>9:16 竖屏</option></select></div><div><label>改编模式</label><select id="adaptMode">'+modeOptions+'</select><label>必保留的人物关系与剧情约束</label><textarea id="adaptConstraints" rows="6" style="width:100%" placeholder="例如：人物关系、记录被改写的原因、不能提前揭露的信息；写“无”表示不增加额外限制">'+escapeHtml(cfg.constraints||'')+'</textarea></div></div><p class="hint">修改会增加改编参数版本，使大纲与后续依赖阶段待复核。原创分支的集数由已验收映射决定，改集数须回到映射候选流程。</p>','保存改编参数',()=>{
  const episodes=Number(document.querySelector('#episodeCount').value),min=Number(document.querySelector('#adaptMin').value),max=Number(document.querySelector('#adaptMax').value),aspect=document.querySelector('#adaptAspect').value.startsWith('9:16')?'9:16':'16:9';
  if(episodes<1||min<=0||max<min)throw Error('请检查集数与时长范围');
  if(original&&episodes!==Number(cfg.episodes))throw Error('原创分支集数锁定于已接受映射；请重新生成映射候选后再改集数');
  const next={...cfg,genre:document.querySelector('#adaptGenre').value,episodes,minMinutes:min,maxMinutes:max,aspectRatio:aspect,mode:document.querySelector('#adaptMode').value,constraints:document.querySelector('#adaptConstraints').value.trim(),version:(cfg.version||0)+1};
  const changed=['genre','episodes','minMinutes','maxMinutes','aspectRatio','mode','constraints'].some(k=>next[k]!==cfg[k]);
  state.adaptationSettings=next;state.aspectRatio=aspect;
  if(changed){markStageEdited('outline','改编参数更新 · v'+next.version);state.outlineChecks=null;recordChange('改编参数保存 · v'+next.version)}
  persistPrototype();render();toast(changed?'改编参数已保存；大纲及下游阶段需复核':'改编参数没有变化')
 })
}

function openOriginalBriefModal(){if(originalFlow())return showModal('当前演示项目已存在原创作品','<p>此原型目前只持久化一个演示项目。为避免覆盖，先完成或导出当前工作区后再新建；多项目切换列为生产版本能力。</p>','知道了');showModal('新建原创小说项目','<p class="hint">从创意开始：先确定创作边界，再由 AI 逐阶段形成候选。每一阶段均需审阅，小说正文不会自动直接进入视频生成。</p>'+inputField('项目 / 小说名','origTitle','','例如：雾港来信')+'<label>一句话创意 / 核心 premise</label><textarea id="origPremise" rows="4" style="width:100%" placeholder="主人公是谁、想要什么、遇到什么阻碍，失败会失去什么？"></textarea><div class="workspace-grid"><div><label>题材</label><select id="origGenre"><option>都市情感</option><option>悬疑推理</option><option>古装权谋</option><option>奇幻冒险</option><option>科幻</option><option>自定义</option></select><label>目标读者</label><input id="origAudience" style="width:100%" placeholder="受众年龄、偏好与平台"></div><div><label>叙事视角</label><select id="origPOV"><option>第三人称有限</option><option>第一人称</option><option>多视角</option><option>由 AI 提案，作者确认</option></select><label>整体风格</label><input id="origStyle" style="width:100%" placeholder="克制、快节奏、轻喜剧等"></div></div><div class="workspace-grid"><div><label>规模目标</label><div class="rightrow"><input id="origChapters" type="number" min="1" value="30" aria-label="目标章节数"><span>章</span><input id="origWords" type="number" min="300" value="2500" aria-label="每章目标字数"><span>字 / 章</span></div></div><div><label>内容边界 / 禁写项</label><input id="origBoundaries" style="width:100%" placeholder="分级、禁区、不能改变的设定"></div></div><label>参考作品 / 风格说明（仅描述，不上传受版权保护全文）</label><textarea id="origRefs" rows="2" style="width:100%" placeholder="说明希望借鉴的节奏或类型特征，避免要求复刻在世作者文风"></textarea><label><input id="origOwnRights" type="checkbox" checked> 我确认本创意和后续生成内容由本项目创作；参考材料另行登记权利</label><p class="hint">保存后建立可编辑创作简报。真实运行需要配置文本模型 API；此原型只会创建演示任务。</p>','保存创作简报',()=>{const premise=document.querySelector('#origPremise').value.trim(),title=document.querySelector('#origTitle').value.trim(),chapters=Number(document.querySelector('#origChapters').value),words=Number(document.querySelector('#origWords').value);if(!title||!premise)throw Error('小说名和一句话创意必填');if(chapters<1|| function markOriginalDescendantsStale(id){const next={bible:['outline','characters','chapters','continuity','handoff'],outline:['characters','chapters','continuity','handoff'],characters:['chapters','continuity','handoff'],chapters:['continuity','handoff'],continuity:['handoff'],handoff:[]};const f=originalFlow();for(const key of next[id]||[]){const st=f?.stages[key];if(st&&st.status!=='待开始'){st.status='待复核';st.stale=true;st.version=(st.version||0)+1;st.candidate='';st.accepted=null}}if(f)f.version++}
function originalScopeNumbers(f){const raw=String(f?.releaseScope||'').trim();if(!raw)return [];const out=new Set();for(const part of raw.split(',')){const m=part.trim().match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);if(!m)return [];const a=+m[1],b=+(m[2]||m[1]);if(a<1||b<a||b>Number(f.brief.targetChapters))return [];for(let n=a;n<=b;n++)out.add(n)}return [...out].sort((a,b)=>a-b)}
function originalScopeReady(f){const nums=originalScopeNumbers(f);return nums.length>0&&nums.every(n=>(f.chapters||[]).some(c=>c.number===n&&c.accepted))}
